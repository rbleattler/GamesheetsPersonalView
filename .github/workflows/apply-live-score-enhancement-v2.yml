name: Apply live score enhancement v2

on:
  push:
    branches:
      - feature/live-score-refresh

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/live-score-refresh

      - name: Patch live score UI and polling
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          p = Path('gamesheets_plus.html')
          s = p.read_text()

          def replace_exact(old, new, expected=1, label='anchor'):
              global s
              count = s.count(old)
              if count != expected:
                  raise RuntimeError(f'{label}: expected {expected}, found {count}')
              s = s.replace(old, new)

          replace_exact(
              '    .status-line {\n        display: flex;\n        align-items: center;\n        gap: 9px;',
              '    .status-line {\n        display: flex;\n        align-items: center;\n        flex-wrap: wrap;\n        gap: 9px;',
              label='status flex')

          replace_exact(
              '    .matchup {\n        min-width: 235px;\n    }\n\n    .team-line {',
              '    .matchup {\n        min-width: 235px;\n    }\n\n    .matchup-lines {\n        display: flex;\n        flex-direction: column;\n        min-width: 0;\n    }\n\n    .team-line {',
              label='matchup css')

          live_css = '''    .badge.live {
              display: inline-flex;
              align-items: center;
              gap: 6px;
              color: #fff;
              background: #dc2626;
          }

          .badge.live::before {
              content: "";
              width: 6px;
              height: 6px;
              border-radius: 50%;
              background: currentColor;
              animation: livePulse 1.35s ease-in-out infinite;
          }

          @keyframes livePulse {
              0%, 100% { opacity: 1; }
              50% { opacity: 0.35; }
          }

          tbody tr.live-game {
              box-shadow: inset 3px 0 0 #dc2626;
          }

          .live-game .matchup-lines {
              padding: 5px 8px;
              border-radius: 7px;
              background: color-mix(in srgb, #dc2626 7%, transparent);
          }

          .live-game .team-name {
              font-weight: 650;
          }

          .live-score {
              min-width: 28px;
              font-size: 1.15rem;
              line-height: 1;
          }

          .live-refresh-status {
              margin-left: auto;
              color: var(--muted);
              font-size: 0.78rem;
              white-space: nowrap;
          }

          .live-refresh-status.active {
              color: #dc2626;
              font-weight: 600;
          }

          '''
          replace_exact(
              '    .badge.final {\n        color: var(--success);\n    }\n\n    .game-link {',
              '    .badge.final {\n        color: var(--success);\n    }\n\n' + live_css + '    .game-link {',
              label='live css')

          mobile_live = '''        .matchup-lines {
              min-width: 0;
              width: 100%;
          }

          tbody tr.live-game {
              border-left: 3px solid #dc2626;
              box-shadow: var(--shadow);
          }

          .live-game .matchup-lines {
              padding: 8px 10px;
          }

          .live-refresh-status {
              width: 100%;
              margin-left: 18px;
              white-space: normal;
          }

          '''
          replace_exact(
              '        .matchup {\n            min-width: 0;\n        }\n\n        .team-line {',
              '        .matchup {\n            min-width: 0;\n        }\n\n' + mobile_live + '        .team-line {',
              label='mobile live css')

          replace_exact(
              '    <div class="status-line">\n        <span id="statusDot" class="dot"></span>\n        <span id="statusText">Not loaded</span>\n    </div>',
              '    <div class="status-line">\n        <span id="statusDot" class="dot"></span>\n        <span id="statusText">Not loaded</span>\n        <span id="liveRefreshStatus" class="live-refresh-status" hidden></span>\n    </div>',
              label='status html')

          replace_exact(
              '    const API = "https://gamesheetstats.com/api";\n\n    const state = {',
              '    const API = "https://gamesheetstats.com/api";\n    const LIVE_REFRESH_MS = 30_000;\n\n    const state = {',
              label='poll constant')

          replace_exact(
              '        currentView: "schedule"\n    };',
              '        currentView: "schedule",\n        livePollTimer: null,\n        livePollInFlight: false,\n        lastLiveRefresh: null\n    };',
              label='poll state')

          replace_exact(
              '        "statusDot",\n        "statusText",\n        "gameCount",',
              '        "statusDot",\n        "statusText",\n        "liveRefreshStatus",\n        "gameCount",',
              label='poll element')

          replace_exact(
              '            showStatus(\n                `Loaded ${state.games.length.toLocaleString()} games · ${state.gameLoadMode}`,\n                "ok"\n            );',
              '            showStatus(\n                `Loaded ${state.games.length.toLocaleString()} games · ${state.gameLoadMode}`,\n                "ok"\n            );\n\n            startLivePolling();',
              label='start polling')

          division_fn = '    function gameDivisionIds(game) {\n        return new Set([\n            game.home?.division?.id,\n            game.visitor?.division?.id\n        ].filter(Boolean).map(String));\n    }'
          helpers = r'''

              function normalizedGameStatus(game) {
                  return String(game?.status ?? "")
                      .trim()
                      .toLowerCase()
                      .replace(/[_-]+/g, " ")
                      .replace(/\s+/g, " ");
              }

              function isLiveGame(game) {
                  const status = normalizedGameStatus(game);

                  return (
                      status === "live" ||
                      status === "active" ||
                      status === "started" ||
                      status === "playing" ||
                      status === "inprogress" ||
                      status.includes("in progress") ||
                      status.startsWith("period ")
                  );
              }

              function statusBadgeHtml(game) {
                  if (isLiveGame(game)) {
                      return `<span class="badge live">LIVE</span>`;
                  }

                  const status = normalizedGameStatus(game);
                  const cssClass = status === "final" ? "final" :
                      status === "scheduled" ? "scheduled" : "";

                  return `
                      <span class="badge ${cssClass}">
                          ${escapeHtml(prettyType(game.status))}
                      </span>
                  `;
              }

              function currentViewGames() {
                  return state.currentView === "rink"
                      ? rinkDayGames()
                      : filteredGames();
              }

              function visibleLiveGames() {
                  return currentViewGames().filter(isLiveGame);
              }

              function updateLiveRefreshStatus() {
                  const liveCount = visibleLiveGames().length;

                  if (!liveCount) {
                      els.liveRefreshStatus.hidden = true;
                      els.liveRefreshStatus.textContent = "";
                      els.liveRefreshStatus.classList.remove("active");
                      return;
                  }

                  const checked = state.lastLiveRefresh
                      ? ` · checked ${formatTime(state.lastLiveRefresh)}`
                      : "";

                  els.liveRefreshStatus.hidden = false;
                  els.liveRefreshStatus.classList.add("active");
                  els.liveRefreshStatus.textContent =
                      `${liveCount} live · auto-refresh 30s${checked}`;
              }

              function mergeRefreshedGames(freshGames) {
                  const freshById = new Map(
                      freshGames
                          .filter(game => game?.gameId != null)
                          .map(game => [String(game.gameId), game])
                  );

                  state.games = state.games.map(game =>
                      freshById.get(String(game.gameId)) || game
                  );
              }

              async function refreshVisibleLiveGames() {
                  if (state.livePollInFlight || document.hidden) {
                      return;
                  }

                  const liveGames = visibleLiveGames();

                  if (!liveGames.length) {
                      updateLiveRefreshStatus();
                      return;
                  }

                  state.livePollInFlight = true;

                  try {
                      const divisionIds = new Set();

                      for (const game of liveGames) {
                          for (const divisionId of gameDivisionIds(game)) {
                              divisionIds.add(divisionId);
                          }
                      }

                      let refreshedGames = [];

                      if (divisionIds.size) {
                          const results = await Promise.allSettled(
                              [...divisionIds].map(async divisionId => {
                                  const body = await fetchJson(
                                      `${API}/unified-games/${state.seasonId}` +
                                      `?division=${encodeURIComponent(divisionId)}`
                                  );

                                  const games = dataOf(body);
                                  return Array.isArray(games) ? games : [];
                              })
                          );

                          for (const result of results) {
                              if (result.status === "fulfilled") {
                                  refreshedGames.push(...result.value);
                              }
                          }
                      }
                      else {
                          const body = await fetchJson(
                              `${API}/unified-games/${state.seasonId}`
                          );
                          const games = dataOf(body);
                          refreshedGames = Array.isArray(games) ? games : [];
                      }

                      mergeRefreshedGames(refreshedGames);
                      state.lastLiveRefresh = new Date();

                      if (state.currentView === "rink") {
                          renderRinkDay();
                      }
                      else {
                          applyFilters();
                      }
                  }
                  catch (error) {
                      console.warn("Live score refresh failed:", error);
                  }
                  finally {
                      state.livePollInFlight = false;
                      updateLiveRefreshStatus();
                  }
              }

              function startLivePolling() {
                  if (state.livePollTimer) {
                      clearInterval(state.livePollTimer);
                  }

                  state.livePollTimer = setInterval(
                      refreshVisibleLiveGames,
                      LIVE_REFRESH_MS
                  );

                  updateLiveRefreshStatus();
              }'''
          helpers = '\n'.join(line[4:] if line.startswith('    ') else line for line in helpers.splitlines())
          replace_exact(division_fn, division_fn + helpers, label='live helpers')

          replace_exact(
              '        if (mode === "upcoming") {\n            return date >= now;\n        }',
              '        if (mode === "upcoming") {\n            return isLiveGame(game) || date >= now;\n        }',
              label='upcoming live')

          row_old = '            if (\n                state.myTeamId &&\n                gameHasTeam(game, state.myTeamId)\n            ) {\n                row.classList.add("my-team");\n            }\n\n            const date = gameDate(game);'
          row_new = '            if (\n                state.myTeamId &&\n                gameHasTeam(game, state.myTeamId)\n            ) {\n                row.classList.add("my-team");\n            }\n\n            if (isLiveGame(game)) {\n                row.classList.add("live-game");\n            }\n\n            const date = gameDate(game);'
          replace_exact(row_old, row_new, expected=2, label='live row class')

          matchup_start = '                <td class="matchup">\n                    <div class="team-line away">'
          matchup_start_new = '                <td class="matchup">\n                    <div class="matchup-lines">\n                        <div class="team-line away">'
          replace_exact(matchup_start, matchup_start_new, expected=2, label='matchup wrapper open')

          visitor_close = '                        ${scoreHtml(game, "visitor")}\n                    </div>\n\n                    <div class="team-line">'
          visitor_close_new = '                            ${scoreHtml(game, "visitor")}\n                        </div>\n\n                        <div class="team-line">'
          replace_exact(visitor_close, visitor_close_new, expected=2, label='matchup visitor indentation')

          home_close = '                        ${scoreHtml(game, "home")}\n                    </div>\n                </td>'
          home_close_new = '                            ${scoreHtml(game, "home")}\n                        </div>\n                    </div>\n                </td>'
          replace_exact(home_close, home_close_new, expected=2, label='matchup wrapper close')

          status_old = '                <td>\n                    <span class="badge ${escapeHtml(game.status)}">\n                        ${escapeHtml(prettyType(game.status))}\n                    </span>\n                </td>'
          status_new = '                <td>\n                    ${statusBadgeHtml(game)}\n                </td>'
          replace_exact(status_old, status_new, expected=2, label='status badges')

          replace_exact(
              '            els.rinkDayEmptyState.hidden = true;\n            return;',
              '            els.rinkDayEmptyState.hidden = true;\n            updateLiveRefreshStatus();\n            return;',
              label='rink empty status')

          replace_exact(
              '            els.rinkDayBody.appendChild(row);\n        }\n    }\n\n    /* ---------------- RENDER ---------------- */',
              '            els.rinkDayBody.appendChild(row);\n        }\n\n        updateLiveRefreshStatus();\n    }\n\n    /* ---------------- RENDER ---------------- */',
              label='rink status update')

          replace_exact(
              '    function applyFilters() {\n        renderGames(filteredGames());\n    }',
              '    function applyFilters() {\n        renderGames(filteredGames());\n        updateLiveRefreshStatus();\n    }',
              label='filter status update')

          replace_exact(
              '    function scoreHtml(game, side) {\n        if (game.status === "scheduled") {\n            return `<span class="score"></span>`;\n        }\n\n        return `\n            <span class="score">\n                ${escapeHtml(game[side]?.goals ?? "")}\n            </span>\n        `;\n    }',
              '    function scoreHtml(game, side) {\n        if (normalizedGameStatus(game) === "scheduled") {\n            return `<span class="score"></span>`;\n        }\n\n        const liveClass = isLiveGame(game) ? " live-score" : "";\n\n        return `\n            <span class="score${liveClass}">\n                ${escapeHtml(game[side]?.goals ?? "")}\n            </span>\n        `;\n    }',
              label='live score')

          replace_exact(
              '        else {\n            applyFilters();\n        }\n    }\n\n    /* ---------------- PREFERENCES ---------------- */',
              '        else {\n            applyFilters();\n        }\n\n        updateLiveRefreshStatus();\n    }\n\n    /* ---------------- PREFERENCES ---------------- */',
              label='view status update')

          replace_exact(
              '    els.todayButton.addEventListener("click", () => {\n        els.rinkDayDate.value = todayKey();\n        saveRinkDayPreferences();\n        renderRinkDay();\n    });\n\n    load();',
              '    els.todayButton.addEventListener("click", () => {\n        els.rinkDayDate.value = todayKey();\n        saveRinkDayPreferences();\n        renderRinkDay();\n    });\n\n    document.addEventListener("visibilitychange", () => {\n        if (!document.hidden) {\n            refreshVisibleLiveGames();\n        }\n    });\n\n    load();',
              label='visibility refresh')

          p.write_text(s)
          PY

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          html = Path('gamesheets_plus.html').read_text()
          match = re.search(r'<script>\s*(.*?)\s*</script>', html, re.S)
          if not match:
              raise SystemExit('Inline script not found')
          Path('/tmp/gamesheets-plus.js').write_text(match.group(1))
          PY
          node --check /tmp/gamesheets-plus.js

      - name: Commit enhancement
        shell: bash
        run: |
          if git diff --quiet -- gamesheets_plus.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gamesheets_plus.html
          git commit -m "feat: improve live game scores and auto-refresh"
          git push origin HEAD:feature/live-score-refresh
