name: Apply live score enhancement

on:
  push:
    branches:
      - feature/live-score-refresh

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/live-score-refresh

      - name: Patch live score UI and polling
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          p = Path('gamesheets_plus.html')
          s = p.read_text()

          def replace_once(old, new, label):
              global s
              if old not in s:
                  raise RuntimeError(f'Missing patch anchor: {label}')
              s = s.replace(old, new, 1)

          replace_once(
          '''    .status-line {
                  display: flex;
                  align-items: center;
                  gap: 9px;''',
          '''    .status-line {
                  display: flex;
                  align-items: center;
                  flex-wrap: wrap;
                  gap: 9px;''',
          'status-line flex wrap')

          replace_once(
          '''    .matchup {
                  min-width: 235px;
              }

              .team-line {''',
          '''    .matchup {
                  min-width: 235px;
              }

              .matchup-lines {
                  display: flex;
                  flex-direction: column;
                  min-width: 0;
              }

              .team-line {''',
          'matchup wrapper CSS')

          replace_once(
          '''    .badge.final {
                  color: var(--success);
              }

              .game-link {''',
          '''    .badge.final {
                  color: var(--success);
              }

              .badge.live {
                  display: inline-flex;
                  align-items: center;
                  gap: 6px;
                  color: #fff;
                  background: #dc2626;
              }

              .badge.live::before {
                  content: "";
                  width: 6px;
                  height: 6px;
                  border-radius: 50%;
                  background: currentColor;
                  animation: livePulse 1.35s ease-in-out infinite;
              }

              @keyframes livePulse {
                  0%, 100% { opacity: 1; }
                  50% { opacity: 0.35; }
              }

              tbody tr.live-game {
                  box-shadow: inset 3px 0 0 #dc2626;
              }

              .live-game .matchup-lines {
                  padding: 5px 8px;
                  border-radius: 7px;
                  background: color-mix(in srgb, #dc2626 7%, transparent);
              }

              .live-game .team-name {
                  font-weight: 650;
              }

              .live-score {
                  min-width: 28px;
                  font-size: 1.15rem;
                  line-height: 1;
              }

              .live-refresh-status {
                  margin-left: auto;
                  color: var(--muted);
                  font-size: 0.78rem;
                  white-space: nowrap;
              }

              .live-refresh-status.active {
                  color: #dc2626;
                  font-weight: 600;
              }

              .game-link {''',
          'live CSS')

          replace_once(
          '''        .matchup {
                      min-width: 0;
                  }

                  .team-line {''',
          '''        .matchup {
                      min-width: 0;
                  }

                  .matchup-lines {
                      min-width: 0;
                      width: 100%;
                  }

                  tbody tr.live-game {
                      border-left: 3px solid #dc2626;
                      box-shadow: var(--shadow);
                  }

                  .live-game .matchup-lines {
                      padding: 8px 10px;
                  }

                  .live-refresh-status {
                      width: 100%;
                      margin-left: 18px;
                      white-space: normal;
                  }

                  .team-line {''',
          'mobile live CSS')

          replace_once(
          '''    <div class="status-line">
                  <span id="statusDot" class="dot"></span>
                  <span id="statusText">Not loaded</span>
              </div>''',
          '''    <div class="status-line">
                  <span id="statusDot" class="dot"></span>
                  <span id="statusText">Not loaded</span>
                  <span id="liveRefreshStatus" class="live-refresh-status" hidden></span>
              </div>''',
          'live refresh status HTML')

          replace_once(
          '''    const API = "https://gamesheetstats.com/api";

              const state = {''',
          '''    const API = "https://gamesheetstats.com/api";
              const LIVE_REFRESH_MS = 30_000;

              const state = {''',
          'live refresh constant')

          replace_once(
          '''        favoriteRinks: new Set(
                      JSON.parse(localStorage.getItem("dvhl.favoriteRinks") || "[]")
                  ),
                  currentView: "schedule"
              };''',
          '''        favoriteRinks: new Set(
                      JSON.parse(localStorage.getItem("dvhl.favoriteRinks") || "[]")
                  ),
                  currentView: "schedule",
                  livePollTimer: null,
                  livePollInFlight: false,
                  lastLiveRefresh: null
              };''',
          'live polling state')

          replace_once(
          '''        "statusDot",
                  "statusText",
                  "gameCount",''',
          '''        "statusDot",
                  "statusText",
                  "liveRefreshStatus",
                  "gameCount",''',
          'live status element')

          replace_once(
          '''            showStatus(
                          `Loaded ${state.games.length.toLocaleString()} games · ${state.gameLoadMode}`,
                          "ok"
                      );''',
          '''            showStatus(
                          `Loaded ${state.games.length.toLocaleString()} games · ${state.gameLoadMode}`,
                          "ok"
                      );

                      startLivePolling();''',
          'start live polling')

          replace_once(
          '''    function gameDivisionIds(game) {
                  return new Set([
                      game.home?.division?.id,
                      game.visitor?.division?.id
                  ].filter(Boolean).map(String));
              }

              function matchesWhen(game, mode) {''',
          '''    function gameDivisionIds(game) {
                  return new Set([
                      game.home?.division?.id,
                      game.visitor?.division?.id
                  ].filter(Boolean).map(String));
              }

              function normalizedGameStatus(game) {
                  return String(game?.status ?? "")
                      .trim()
                      .toLowerCase()
                      .replace(/[_-]+/g, " ")
                      .replace(/\\s+/g, " ");
              }

              function isLiveGame(game) {
                  const status = normalizedGameStatus(game);

                  return (
                      status === "live" ||
                      status === "active" ||
                      status === "started" ||
                      status === "playing" ||
                      status === "inprogress" ||
                      status.includes("in progress") ||
                      status.startsWith("period ")
                  );
              }

              function statusBadgeHtml(game) {
                  if (isLiveGame(game)) {
                      return `<span class="badge live">LIVE</span>`;
                  }

                  const status = normalizedGameStatus(game);
                  const cssClass = status === "final" ? "final" :
                      status === "scheduled" ? "scheduled" : "";

                  return `
                      <span class="badge ${cssClass}">
                          ${escapeHtml(prettyType(game.status))}
                      </span>
                  `;
              }

              function currentViewGames() {
                  return state.currentView === "rink"
                      ? rinkDayGames()
                      : filteredGames();
              }

              function visibleLiveGames() {
                  return currentViewGames().filter(isLiveGame);
              }

              function updateLiveRefreshStatus() {
                  const liveCount = visibleLiveGames().length;

                  if (!liveCount) {
                      els.liveRefreshStatus.hidden = true;
                      els.liveRefreshStatus.textContent = "";
                      els.liveRefreshStatus.classList.remove("active");
                      return;
                  }

                  const checked = state.lastLiveRefresh
                      ? ` · checked ${formatTime(state.lastLiveRefresh)}`
                      : "";

                  els.liveRefreshStatus.hidden = false;
                  els.liveRefreshStatus.classList.add("active");
                  els.liveRefreshStatus.textContent =
                      `${liveCount} live · auto-refresh 30s${checked}`;
              }

              function mergeRefreshedGames(freshGames) {
                  const freshById = new Map(
                      freshGames
                          .filter(game => game?.gameId != null)
                          .map(game => [String(game.gameId), game])
                  );

                  state.games = state.games.map(game =>
                      freshById.get(String(game.gameId)) || game
                  );
              }

              async function refreshVisibleLiveGames() {
                  if (state.livePollInFlight || document.hidden) {
                      return;
                  }

                  const liveGames = visibleLiveGames();

                  if (!liveGames.length) {
                      updateLiveRefreshStatus();
                      return;
                  }

                  state.livePollInFlight = true;

                  try {
                      const divisionIds = new Set();

                      for (const game of liveGames) {
                          for (const divisionId of gameDivisionIds(game)) {
                              divisionIds.add(divisionId);
                          }
                      }

                      let refreshedGames = [];

                      if (divisionIds.size) {
                          const results = await Promise.allSettled(
                              [...divisionIds].map(async divisionId => {
                                  const body = await fetchJson(
                                      `${API}/unified-games/${state.seasonId}` +
                                      `?division=${encodeURIComponent(divisionId)}`
                                  );

                                  const games = dataOf(body);
                                  return Array.isArray(games) ? games : [];
                              })
                          );

                          for (const result of results) {
                              if (result.status === "fulfilled") {
                                  refreshedGames.push(...result.value);
                              }
                          }
                      }
                      else {
                          const body = await fetchJson(
                              `${API}/unified-games/${state.seasonId}`
                          );
                          const games = dataOf(body);
                          refreshedGames = Array.isArray(games) ? games : [];
                      }

                      mergeRefreshedGames(refreshedGames);
                      state.lastLiveRefresh = new Date();

                      if (state.currentView === "rink") {
                          renderRinkDay();
                      }
                      else {
                          applyFilters();
                      }
                  }
                  catch (error) {
                      console.warn("Live score refresh failed:", error);
                  }
                  finally {
                      state.livePollInFlight = false;
                      updateLiveRefreshStatus();
                  }
              }

              function startLivePolling() {
                  if (state.livePollTimer) {
                      clearInterval(state.livePollTimer);
                  }

                  state.livePollTimer = setInterval(
                      refreshVisibleLiveGames,
                      LIVE_REFRESH_MS
                  );

                  updateLiveRefreshStatus();
              }

              function matchesWhen(game, mode) {''',
          'live helper functions')

          replace_once(
          '''        if (mode === "upcoming") {
                      return date >= now;
                  }''',
          '''        if (mode === "upcoming") {
                      return isLiveGame(game) || date >= now;
                  }''',
          'keep live games in upcoming view')

          row_old = '''            if (
                          state.myTeamId &&
                          gameHasTeam(game, state.myTeamId)
                      ) {
                          row.classList.add("my-team");
                      }

                      const date = gameDate(game);'''
          row_new = '''            if (
                          state.myTeamId &&
                          gameHasTeam(game, state.myTeamId)
                      ) {
                          row.classList.add("my-team");
                      }

                      if (isLiveGame(game)) {
                          row.classList.add("live-game");
                      }

                      const date = gameDate(game);'''
          if s.count(row_old) != 2:
              raise RuntimeError(f'Expected 2 game row anchors, found {s.count(row_old)}')
          s = s.replace(row_old, row_new)

          matchup_old = '''                <td class="matchup">
                          <div class="team-line away">
                              <span class="team-name">
                                  ${escapeHtml(game.visitor?.title)}
                              </span>
                              ${scoreHtml(game, "visitor")}
                          </div>

                          <div class="team-line">
                              <span class="team-name">
                                  ${escapeHtml(game.home?.title)}
                              </span>
                              ${scoreHtml(game, "home")}
                          </div>
                      </td>'''
          matchup_new = '''                <td class="matchup">
                          <div class="matchup-lines">
                              <div class="team-line away">
                                  <span class="team-name">
                                      ${escapeHtml(game.visitor?.title)}
                                  </span>
                                  ${scoreHtml(game, "visitor")}
                              </div>

                              <div class="team-line">
                                  <span class="team-name">
                                      ${escapeHtml(game.home?.title)}
                                  </span>
                                  ${scoreHtml(game, "home")}
                              </div>
                          </div>
                      </td>'''
          if s.count(matchup_old) != 2:
              raise RuntimeError(f'Expected 2 matchup anchors, found {s.count(matchup_old)}')
          s = s.replace(matchup_old, matchup_new)

          status_old = '''                <td>
                          <span class="badge ${escapeHtml(game.status)}">
                              ${escapeHtml(prettyType(game.status))}
                          </span>
                      </td>'''
          status_new = '''                <td>
                          ${statusBadgeHtml(game)}
                      </td>'''
          if s.count(status_old) != 2:
              raise RuntimeError(f'Expected 2 status anchors, found {s.count(status_old)}')
          s = s.replace(status_old, status_new)

          replace_once(
          '''            els.rinkDayEmptyState.hidden = true;
                      return;''',
          '''            els.rinkDayEmptyState.hidden = true;
                      updateLiveRefreshStatus();
                      return;''',
          'rink empty live status')

          replace_once(
          '''            els.rinkDayBody.appendChild(row);
                  }
              }

              /* ---------------- RENDER ---------------- */''',
          '''            els.rinkDayBody.appendChild(row);
                  }

                  updateLiveRefreshStatus();
              }

              /* ---------------- RENDER ---------------- */''',
          'rink render live status')

          replace_once(
          '''    function applyFilters() {
                  renderGames(filteredGames());
              }''',
          '''    function applyFilters() {
                  renderGames(filteredGames());
                  updateLiveRefreshStatus();
              }''',
          'filter live status')

          replace_once(
          '''    function scoreHtml(game, side) {
                  if (game.status === "scheduled") {
                      return `<span class="score"></span>`;
                  }

                  return `
                      <span class="score">
                          ${escapeHtml(game[side]?.goals ?? "")}
                      </span>
                  `;
              }''',
          '''    function scoreHtml(game, side) {
                  if (normalizedGameStatus(game) === "scheduled") {
                      return `<span class="score"></span>`;
                  }

                  const liveClass = isLiveGame(game) ? " live-score" : "";

                  return `
                      <span class="score${liveClass}">
                          ${escapeHtml(game[side]?.goals ?? "")}
                      </span>
                  `;
              }''',
          'live score rendering')

          replace_once(
          '''        else {
                      applyFilters();
                  }
              }

              /* ---------------- PREFERENCES ---------------- */''',
          '''        else {
                      applyFilters();
                  }

                  updateLiveRefreshStatus();
              }

              /* ---------------- PREFERENCES ---------------- */''',
          'view switching live status')

          replace_once(
          '''    els.todayButton.addEventListener("click", () => {
                  els.rinkDayDate.value = todayKey();
                  saveRinkDayPreferences();
                  renderRinkDay();
              });

              load();''',
          '''    els.todayButton.addEventListener("click", () => {
                  els.rinkDayDate.value = todayKey();
                  saveRinkDayPreferences();
                  renderRinkDay();
              });

              document.addEventListener("visibilitychange", () => {
                  if (!document.hidden) {
                      refreshVisibleLiveGames();
                  }
              });

              load();''',
          'visibility live refresh')

          p.write_text(s)
          PY

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          html = Path('gamesheets_plus.html').read_text()
          match = re.search(r'<script>\s*(.*?)\s*</script>', html, re.S)
          if not match:
              raise SystemExit('Inline script not found')
          Path('/tmp/gamesheets-plus.js').write_text(match.group(1))
          PY
          node --check /tmp/gamesheets-plus.js

      - name: Commit enhancement
        shell: bash
        run: |
          if git diff --quiet -- gamesheets_plus.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gamesheets_plus.html
          git commit -m "feat: improve live game scores and auto-refresh"
          git push origin HEAD:feature/live-score-refresh
