name: Build V3.1 preview
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build V3.1
        run: python tools/build_v3_1_fixed.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('v3.1.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',s,flags=re.S)
          if len(scripts)!=1: raise SystemExit(f'Expected one inline script, got {len(scripts)}')
          Path('/tmp/v31.js').write_text(scripts[0])
          PY
          node --check /tmp/v31.js
      - name: Commit V3.1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v3.1.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: add V3.1 filtered schedules, player follows, settings, and rebrand"
          git push origin HEAD:main
