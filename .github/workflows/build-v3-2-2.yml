name: Build V3.2.2 preview
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build preview
        shell: bash
        run: |
          sed -i "s/pat.subn(player, s, count=1)/pat.subn(lambda m: player, s, count=1)/" tools/build_v3_2_2.py
          sed -i "s/pat.subn(render_stats, s, count=1)/pat.subn(lambda m: render_stats, s, count=1)/" tools/build_v3_2_2.py
          python3 tools/build_v3_2_2.py
      - name: Validate inline JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('v3.2.2.html').read_text()
          js=re.findall(r'<script>(.*?)</script>',s,re.S)
          Path('/tmp/app.js').write_text('\n'.join(js))
          PY
          node --check /tmp/app.js
      - name: Commit preview
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v3.2.2.html
          git diff --cached --quiet && exit 0
          git commit -m 'feat: add V3.2.2 player activity and appearance controls'
          git push
