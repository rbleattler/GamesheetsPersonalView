name: BuildV323
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/build-v3-2-3.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: python3 tools/build_v3_2_3.py
      - name: Validate
        run: |
          python3 -c "import re,pathlib; s=pathlib.Path('v3.2.3.html').read_text(); pathlib.Path('/tmp/app.js').write_text('\\n'.join(re.findall(r'<script>(.*?)</script>',s,re.S)))"
          node --check /tmp/app.js
          grep -q "Away PIM" v3.2.3.html
          grep -q "compareGameEvents" v3.2.3.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v3.2.3.html gamesheets_plus.html index.html
          git commit -m "fix: order game events and restore PIM totals"
          git push
