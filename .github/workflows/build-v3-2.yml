name: Build V3.2 preview
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore V3.2 builder
        shell: bash
        run: |
          mkdir -p tools
          cat > /tmp/build_v3_2.py.gz.b64 <<'EOF'

EOF
          base64 -d /tmp/build_v3_2.py.gz.b64 | gzip -d > tools/build_v3_2.py
      - name: Build V3.2
        run: python tools/build_v3_2.py
      - name: Validate inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('v3.2.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',s,flags=re.S)
          if len(scripts)!=1: raise SystemExit(f'Expected one inline script, got {len(scripts)}')
          Path('/tmp/v32.js').write_text(scripts[0])
          PY
          node --check /tmp/v32.js
      - name: Commit V3.2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v3.2.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: add V3.2 team roster and player detail views"
          git push origin HEAD:main
