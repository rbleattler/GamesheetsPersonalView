name: Build V3.3
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-v3-3.yml
      - tools/build_v3_3.py
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build V3.3
        run: python3 tools/build_v3_3.py
      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('v3.3.html').read_text(encoding='utf-8')
          Path('/tmp/app.js').write_text('\n'.join(re.findall(r'<script>(.*?)</script>',s,re.S)),encoding='utf-8')
          assert 'Box Score' in s
          assert 'timelineHtml' in s
          assert 'score-team-stats' in s
          PY
          node --check /tmp/app.js
      - name: Commit V3.3
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v3.3.html gamesheets_plus.html index.html
          git commit -m 'feat: redesign game summary and compact scoreboard'
          git push
