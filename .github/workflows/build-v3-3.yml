name: Build V3.3
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-v3-3.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build V3.3
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          src = Path('v3.2.3.html').read_text(encoding='utf-8')
          s = src.replace('MyHockeyHub — V3.2.3', 'MyHockeyHub — V3.3').replace('>V3.2.3<', '>V3.3<')

          css = r'''
/* V3.3: compact scoreboard, timeline summary, and box score */
.game-scoreboard{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center;padding:15px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(155deg,#102238,#0d1a29)}
.score-team{min-width:0;text-align:center}.score-team .logo{margin:0 auto 7px}.score-team-name{font-weight:850;line-height:1.15;min-height:2.3em;display:grid;place-items:center}.score-team-stats{display:flex;justify-content:center;gap:6px;margin-top:9px}.score-mini{min-width:52px;padding:6px 7px;border:1px solid #304a66;border-radius:10px;background:#0d1a2a;text-align:center}.score-mini small{display:block;color:var(--muted);font-size:.58rem;letter-spacing:.06em;text-transform:uppercase}.score-mini b{display:block;margin-top:1px;font-size:1rem}.score-center{text-align:center;display:grid;gap:6px;justify-items:center}.score-center .bigscore{font-size:2.5rem}.score-state{color:var(--muted);font-weight:750}.score-gs{font-size:.76rem;border:1px solid #2f5f8a;border-radius:10px;padding:6px 8px;text-decoration:none;color:var(--blue);white-space:nowrap}
.timeline{display:grid;gap:10px}.period-block{border:1px solid #243e58;border-radius:14px;overflow:hidden;background:#0d1a28}.period-head{display:flex;justify-content:space-between;align-items:center;padding:8px 11px;background:#122a43;color:#cde4f9;font-size:.83rem;font-weight:850}.period-score{font-size:.75rem;color:#9fb8d0}.timeline-items{display:grid}.timeline-event{display:grid;grid-template-columns:50px 28px 46px minmax(0,1fr) 18px;gap:8px;align-items:center;padding:10px 11px;border-top:1px solid rgba(120,150,180,.12);cursor:pointer;outline:none}.timeline-event:first-child{border-top:0}.timeline-event:hover,.timeline-event:focus{background:rgba(85,167,255,.055)}.timeline-time{color:#abc0d5;font-variant-numeric:tabular-nums}.timeline-icon{font-size:1rem;text-align:center}.timeline-main{min-width:0}.timeline-main .primary{font-weight:830;background:none;border:0;padding:0;min-height:0;text-align:left;color:var(--blue)}.timeline-main .secondary{color:var(--muted);font-size:.78rem;margin-top:2px;white-space:normal}.timeline-chevron{color:var(--muted);font-size:1.1rem;transition:transform .15s ease}.timeline-event[aria-expanded="true"] .timeline-chevron{transform:rotate(90deg)}.timeline-detail{padding:10px 12px 12px;border-top:1px solid rgba(120,150,180,.12);background:#0a1623}.event-detail-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-bottom:8px}.event-detail-box{background:#122033;border-radius:10px;padding:7px;text-align:center}.event-detail-box small{display:block;color:var(--muted);font-size:.58rem;text-transform:uppercase}.event-detail-box b{display:block;margin-top:2px}.event-detail-line{display:grid;grid-template-columns:82px minmax(0,1fr);gap:8px;padding:5px 0;border-top:1px solid rgba(120,150,180,.1);font-size:.82rem}.event-detail-line:first-of-type{border-top:0}.event-detail-line span:first-child{color:var(--muted)}
.box-score-wrap{overflow:auto}.box-score{min-width:520px}.box-score th,.box-score td{text-align:center}.box-score th:first-child,.box-score td:first-child{text-align:left}.box-team{display:flex;align-items:center;gap:7px;font-weight:800}.box-team .logo{width:28px;height:28px}.box-total{font-weight:900}.statssection.compact{padding:10px}.summary-heading{display:flex;align-items:center;justify-content:space-between;gap:10px}.summary-heading p{margin:2px 0 0;color:var(--muted);font-size:.76rem}
@media(max-width:560px){.game-scoreboard{gap:7px;padding:11px 8px}.score-team .logo{width:48px;height:48px}.score-team-name{font-size:.82rem}.score-center .bigscore{font-size:2rem}.score-mini{min-width:45px;padding:5px 4px}.score-mini b{font-size:.9rem}.score-gs{font-size:.66rem;padding:5px 6px}.timeline-event{grid-template-columns:44px 26px 42px minmax(0,1fr) 16px;gap:6px;padding:9px 8px}.event-detail-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.tabs .tab{padding-left:10px;padding-right:10px}}
'''
          s = s.replace('</style>', css + '\n</style>', 1)

          pat = re.compile(r"function renderStats\(g,b\)\{.*?\}\nfunction sbox", re.S)
          replacement = r'''function timelineEvents(b){const all=[...goals(b).map(e=>({...e,_type:'goal'})),...penalties(b).map(e=>({...e,_type:'penalty'}))].sort(compareGameEvents),score={visitor:0,home:0};for(const e of all)if(e._type==='goal'&&(e.teamSide==='visitor'||e.teamSide==='home')){score[e.teamSide]++;e.scoreAfter=`${score.visitor} – ${score.home}`}return all}
function periodLabelNice(p){const n=periodSortKey(p);if(n>=1&&n<100)return`Period ${n}`;if(n===100)return'Overtime';if(n===200)return'Shootout';return p||'Other'}
function periodGoalScore(b,p){let v=0,h=0;for(const e of goals(b))if(String(e.periodLabel||e.period||'')===String(p)){if(e.teamSide==='visitor')v++;if(e.teamSide==='home')h++}return`${v} – ${h}`}
function eventSecondary(e){if(e._type==='goal'){const a=[e.assist1By,e.assist2By].filter(x=>x&&(x.firstName||x.lastName||x.title));return a.length?`A: ${a.map(p=>pname(p)).join(', ')}`:'Unassisted'}const d=e.penaltyType?.duration?` · ${e.penaltyType.duration} min`:'';return`${e.penaltyType?.title||'Penalty'}${d}`}
function eventDetailHtml(e,g){const team=e.teamSide==='visitor'?(state._statsBox?.visitor||g.visitor):(state._statsBox?.home||g.home),gs=`https://gamesheetstats.com/seasons/${state.seasonId}/games/${g.gameId}`;if(e._type==='goal'){const assists=[e.assist1By,e.assist2By].filter(x=>x&&(x.firstName||x.lastName||x.title));return`<div class="event-detail-grid"><div class="event-detail-box"><small>Period</small><b>${esc(e.periodLabel||'—')}</b></div><div class="event-detail-box"><small>Time</small><b>${esc(e.time||'—')}</b></div><div class="event-detail-box"><small>Score after</small><b>${esc(e.scoreAfter||'—')}</b></div></div><div class="event-detail-line"><span>Team</span><b>${esc(team?.title||'—')}</b></div><div class="event-detail-line"><span>Scorer</span><div>${inlinePlayerLink(e.goalScorer,e.teamSide)}</div></div><div class="event-detail-line"><span>Assists</span><div>${assists.length?assists.map(p=>inlinePlayerLink(p,e.teamSide)).join(', '):'<span class="muted">Unassisted</span>'}</div></div><div class="actions"><a class="link" target="_blank" rel="noopener" href="${escAttr(gs)}">Open game on GameSheet ↗</a></div>`}return`<div class="event-detail-grid"><div class="event-detail-box"><small>Period</small><b>${esc(e.periodLabel||'—')}</b></div><div class="event-detail-box"><small>Time</small><b>${esc(e.time||'—')}</b></div><div class="event-detail-box"><small>Minutes</small><b>${esc(e.penaltyType?.duration||e.penaltyType?.minutes||'—')}</b></div></div><div class="event-detail-line"><span>Team</span><b>${esc(team?.title||'—')}</b></div><div class="event-detail-line"><span>Player</span><div>${inlinePlayerLink(e.committedBy,e.teamSide)}</div></div><div class="event-detail-line"><span>Penalty</span><b>${esc(e.penaltyType?.title||'Penalty')}</b></div><div class="actions"><a class="link" target="_blank" rel="noopener" href="${escAttr(gs)}">Open game on GameSheet ↗</a></div>`}
function timelineHtml(b,g,mode='all'){let items=timelineEvents(b);if(mode==='goal')items=items.filter(e=>e._type==='goal');if(mode==='penalty')items=items.filter(e=>e._type==='penalty');if(!items.length)return'<div class="empty" style="padding:18px">No events reported.</div>';const groups=new Map();for(const e of items){const p=e.periodLabel||e.period||'';if(!groups.has(p))groups.set(p,[]);groups.get(p).push(e)}let idx=0;return`<div class="timeline">${[...groups.entries()].map(([p,events])=>`<section class="period-block"><div class="period-head"><span>${esc(periodLabelNice(p))}</span><span class="period-score">${mode==='penalty'?'':esc(periodGoalScore(b,p))}</span></div><div class="timeline-items">${events.map(e=>{const id=`evt-${mode}-${idx++}`,player=e._type==='goal'?e.goalScorer:e.committedBy,icon=e._type==='goal'?'🚨':'⚠️';return`<div class="timeline-event" role="button" tabindex="0" aria-expanded="false" data-target="${id}"><div class="timeline-time">${esc(e.time||'')}</div><div class="timeline-icon" aria-hidden="true">${icon}</div><div>${eventTeamTag(e.teamSide)}</div><div class="timeline-main"><div class="primary">${inlinePlayerLink(player,e.teamSide)}</div><div class="secondary">${esc(eventSecondary(e))}</div></div><div class="timeline-chevron">›</div></div><div id="${id}" class="timeline-detail" hidden>${eventDetailHtml(e,g)}</div>`}).join('')}</div></section>`).join('')}</div>`}
function boxScoreHtml(b){const away=b.visitor||{},home=b.home||{},allPeriods=new Set(['P1','P2','P3']);for(const e of goals(b)){const p=e.periodLabel||e.period;if(p)allPeriods.add(String(p))}const periods=[...allPeriods].sort((a,b)=>periodSortKey(a)-periodSortKey(b)),count=(side,p)=>goals(b).filter(e=>e.teamSide===side&&String(e.periodLabel||e.period||'')===String(p)).length,row=(side,t)=>`<tr><td><div class="box-team">${logo(t,'xs')}<span>${esc(t.title||pretty(side))}</span></div></td>${periods.map(p=>`<td>${count(side,p)}</td>`).join('')}<td class="box-total">${esc(t.finalScore??'—')}</td><td>${esc(t.sog??'—')}</td><td>${esc(teamPimValue(t))}</td></tr>`;return`<div class="box-score-wrap"><table class="box-score"><thead><tr><th>Team</th>${periods.map(p=>`<th>${esc(String(p).replace(/^P/,''))}</th>`).join('')}<th>T</th><th>SOG</th><th>PIM</th></tr></thead><tbody>${row('visitor',away)}${row('home',home)}</tbody></table></div>`}
function wireTimeline(root){root.querySelectorAll('.timeline-event').forEach(row=>{const toggle=()=>{const panel=document.getElementById(row.dataset.target),open=row.getAttribute('aria-expanded')==='true';row.setAttribute('aria-expanded',String(!open));if(panel)panel.hidden=open};row.onclick=e=>{if(e.target.closest('.player-link,a,button'))return;toggle()};row.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&!e.target.closest('.player-link,a,button')){e.preventDefault();toggle()}}})}
function renderStats(g,b){state._statsBox=b;state._statsGame=g;const away=b.visitor||g.visitor,home=b.home||g.home;for(const side of ['visitor','home'])for(const p of (b?.[side]?.roster?.players||[]))registerPlayer(statsPlayerRecord(p,b[side]));const awayPim=teamPimValue(away),homePim=teamPimValue(home),gs=`https://gamesheetstats.com/seasons/${state.seasonId}/games/${g.gameId}`,gameState=pretty(stat(g)||'final');els.drawerBody.innerHTML=`<div class="game-scoreboard"><div class="score-team">${logo(away,'sm')}<div class="score-team-name">${esc(away.title||'Away')}</div><div class="score-team-stats"><span class="score-mini"><small>SOG</small><b>${esc(away.sog??'—')}</b></span><span class="score-mini"><small>PIM</small><b>${esc(awayPim)}</b></span></div></div><div class="score-center"><div class="bigscore">${esc(away.finalScore??g.visitor?.goals??'—')} – ${esc(home.finalScore??g.home?.goals??'—')}</div><div class="score-state">${esc(gameState)}</div><a class="score-gs" target="_blank" rel="noopener" href="${escAttr(gs)}">GameSheet ↗</a></div><div class="score-team">${logo(home,'sm')}<div class="score-team-name">${esc(home.title||'Home')}</div><div class="score-team-stats"><span class="score-mini"><small>SOG</small><b>${esc(home.sog??'—')}</b></span><span class="score-mini"><small>PIM</small><b>${esc(homePim)}</b></span></div></div></div><div class="tabs"><button class="tab active" data-tab="summary">Summary</button><button class="tab" data-tab="scoring">Scoring</button><button class="tab" data-tab="penalties">Penalties</button><button class="tab" data-tab="boxscore">Box Score</button><button class="tab" data-tab="players">Players</button></div><div id="summaryPane" class="pane active"><div class="statssection compact"><div class="summary-heading"><div><h3>Game summary</h3><p>Goals and penalties in chronological order.</p></div></div>${timelineHtml(b,g,'all')}</div></div><div id="scoringPane" class="pane"><div class="statssection compact"><h3>Scoring</h3>${timelineHtml(b,g,'goal')}</div></div><div id="penaltiesPane" class="pane"><div class="statssection compact"><h3>Penalties <span class="muted" style="font-size:.78rem;font-weight:500">${esc(abbr(away))} ${esc(awayPim)} PIM · ${esc(abbr(home))} ${esc(homePim)} PIM</span></h3>${timelineHtml(b,g,'penalty')}</div></div><div id="boxscorePane" class="pane"><div class="statssection"><h3>Box Score</h3>${boxScoreHtml(b)}</div></div><div id="playersPane" class="pane"><div class="statssection"><h3>Players</h3>${playerTable(b)}</div></div>`;els.drawerBody.querySelectorAll('.tab').forEach(btn=>btn.onclick=()=>{els.drawerBody.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===btn));els.drawerBody.querySelectorAll('.pane').forEach(x=>x.classList.remove('active'));$(btn.dataset.tab+'Pane').classList.add('active')});wireTimeline(els.drawerBody)}
function sbox'''
          s, n = pat.subn(lambda _: replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'renderStats replacement count={n}')

          Path('v3.3.html').write_text(s, encoding='utf-8')

          stable = Path('gamesheets_plus.html').read_text(encoding='utf-8')
          stable = stable.replace('V3.2.3','V3.3').replace("'3.2.3'","'3.3'").replace("'v3.2.3.html'","'v3.3.html'")
          start = stable.index('  <div class="items">')
          end = stable.index('  <div id="originalNote"', start)
          items = '''  <div class="items">\n    <div class="item"><div class="check">✓</div><div><b>Compact scoreboard</b><span>Shots and penalty minutes now live beside each team in the main score card instead of consuming a separate stats panel.</span></div></div>\n    <div class="item"><div class="check">✓</div><div><b>Timeline game summary</b><span>Goals and penalties are merged into one period-grouped play-by-play with clear event icons and expandable details.</span></div></div>\n    <div class="item"><div class="check">✓</div><div><b>Box Score tab</b><span>Period-by-period goals, final score, shots, and PIM are available in a compact dedicated view.</span></div></div>\n  </div>\n'''
          stable = stable[:start] + items + stable[end:]
          Path('gamesheets_plus.html').write_text(stable, encoding='utf-8')

          index = Path('index.html').read_text(encoding='utf-8')
          index = index.replace('<div class="version"><div class="tag current">V3.2.3</div>', '<div class="version"><div class="tag">V3.2.3</div>', 1)
          marker = '<section class="versions">\n'
          card = '<div class="version"><div class="tag current">V3.3</div><div class="desc"><b>Compact scoreboard and timeline play-by-play</b><span>Moved SOG/PIM into the main score card, redesigned Summary as a period-grouped event timeline with expandable goal/penalty details, and added a dedicated box-score tab.</span></div><a class="open" href="v3.3.html">Open V3.3</a></div>\n'
          index = index.replace(marker, marker + card, 1)
          Path('index.html').write_text(index, encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('v3.3.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          assert 'Box Score' in s
          assert 'timelineHtml' in s
          assert 'score-team-stats' in s
          PY
          node --check /tmp/app.js

      - name: Commit V3.3
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v3.3.html gamesheets_plus.html index.html
          git commit -m 'feat: redesign game summary and compact scoreboard'
          git push
