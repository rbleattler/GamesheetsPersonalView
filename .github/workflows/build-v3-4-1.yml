name: BuildV341
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-v3-4-1.yml
      - tools/build_v3_4_1.py
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build
        run: python3 tools/build_v3_4_1.py
      - name: Validate
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('v3.4.1.html').read_text(encoding='utf-8')
          Path('/tmp/app.js').write_text('\n'.join(re.findall(r'<script>(.*?)</script>',s,re.S)),encoding='utf-8')
          assert 'sortedDivisions' in s
          assert 'V3.4.1' in s
          PY
          node --check /tmp/app.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v3.4.1.html gamesheets_plus.html index.html
          git commit -m 'fix: sort divisions by age and tier'
          git push
