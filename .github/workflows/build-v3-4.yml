name: Build V3.4
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-v3-4.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build V3.4
        run: python3 tools/build_v3_4.py
      - name: Validate inline JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('v3.4.html').read_text(encoding='utf-8')
          Path('/tmp/app.js').write_text('\n'.join(re.findall(r'<script>(.*?)</script>',s,re.S)),encoding='utf-8')
          assert 'My Teams' in s
          assert 'settingsShowStale' in s
          assert 'box-team-short' in s
          assert 'myTeamsBySeason' in s
          PY
          node --check /tmp/app.js
      - name: Commit V3.4
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v3.4.html gamesheets_plus.html index.html
          git commit -m 'feat: support multiple teams and hide stale live games'
          git push
