name: Fix V3.2.2 regex literals
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch generated regex literals
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('v3.2.2.html')
          s=p.read_text()
          s=s.replace(r'/^gsv\\d*\\./', r'/^gsv\d*\./')
          s=s.replace(r'/^dvhl\\./', r'/^dvhl\./')
          s=s.replace(r'/^myhockeyhub\\./', r'/^myhockeyhub\./')
          s=s.replace(r'/\\D/g', r'/\D/g')
          p.write_text(s)
          PY
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('v3.2.2.html').read_text()
          js=re.findall(r'<script>(.*?)</script>',s,re.S)
          Path('/tmp/app.js').write_text('\n'.join(js))
          PY
          node --check /tmp/app.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v3.2.2.html
          git commit -m 'fix: correct generated V3.2.2 regex literals'
          git push
