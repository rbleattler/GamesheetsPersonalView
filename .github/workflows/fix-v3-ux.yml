name: Fix V3 mobile UX and interactions
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch V3
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          p=Path('v3.html')
          s=p.read_text()

          def once(old,new,label):
              global s
              if old not in s:
                  raise RuntimeError(f'missing target: {label}')
              s=s.replace(old,new,1)

          # Compact four-column mobile nav; no horizontal scrolling.
          once(
            '<nav class="nav"><button data-view="team">👥 My Team</button><button data-view="venues">📍 Venues</button><button data-view="players">👤 Players</button><button data-view="schedule">🗓 Schedule</button></nav>',
            '<nav class="nav"><button data-view="team"><span class="nav-icon">👥</span><span class="nav-label">My Team</span></button><button data-view="venues"><span class="nav-icon">📍</span><span class="nav-label">Venues</span></button><button data-view="players"><span class="nav-icon">👤</span><span class="nav-label">Players</span></button><button data-view="schedule"><span class="nav-icon">🗓</span><span class="nav-label">Schedule</span></button></nav>',
            'nav markup')

          mobile_css='''\n@media(max-width:560px){
  .nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));overflow:visible;gap:3px;padding-top:4px;padding-bottom:4px}
  .nav button{min-width:0;padding:7px 2px;font-size:.69rem;display:grid;place-items:center;gap:2px;line-height:1.15}
  .nav-icon{display:block;font-size:1.02rem;line-height:1}.nav-label{display:block;overflow:hidden;text-overflow:ellipsis;max-width:100%}
}
'''
          once('</style>',mobile_css+'</style>','mobile nav css')

          # Do not let a missing optional button make the entire season load report as failed.
          old="bindGameActions(els.teamView);$('#teamSchedule').onclick=$('#allTeamGames').onclick=()=>{state.schedule.team=t.id;setView('schedule')};$('#teamPlayers').onclick=()=>setView('players');$('#changeTeam').onclick=()=>{delete state.myTeamBySeason[state.seasonId];savePrefs();renderTeam()}"
          new="bindGameActions(els.teamView);const teamScheduleBtn=$('#teamSchedule'),allTeamGamesBtn=$('#allTeamGames'),teamPlayersBtn=$('#teamPlayers'),changeTeamBtn=$('#changeTeam');const showTeamSchedule=()=>{state.schedule.team=t.id;setView('schedule')};if(teamScheduleBtn)teamScheduleBtn.onclick=showTeamSchedule;if(allTeamGamesBtn)allTeamGamesBtn.onclick=showTeamSchedule;if(teamPlayersBtn)teamPlayersBtn.onclick=()=>setView('players');if(changeTeamBtn)changeTeamBtn.onclick=()=>{delete state.myTeamBySeason[state.seasonId];savePrefs();renderTeam()}"
          once(old,new,'safe My Team bindings')

          # Venue rows all invoke the same game-stats action, so label them consistently.
          once("${live(g)?'Live':stat(g)==='final'?'Stats':'›'}","Stats",'venue action label')

          # Make Add Players binding defensive.
          once(";$('#addPlayers').onclick=openPlayerPicker;els.playersView.querySelectorAll('.unfollow')",";const addPlayersBtn=$('#addPlayers');if(addPlayersBtn)addPlayersBtn.onclick=()=>openPlayerPicker().catch(e=>{console.error(e);openDrawer('Add Players','Player browser error',`<div class=\"empty\">${esc(e.message)}</div>`)});els.playersView.querySelectorAll('.unfollow')",'Add Players binding')

          # Replace schedule rendering with stateful controls that update only results, avoiding DOM/focus churn.
          schedule_re=re.compile(r"function renderSchedule\(\)\{.*?\nfunction scheduleGames\(\)",re.S)
          schedule_new=r'''function scheduleTeamGroups(divisionId){
  const teams=divisionId?state.teams.filter(t=>t.divisions.has(String(divisionId))):state.teams;
  const groups=new Map();
  for(const t of teams){
    const divTitles=[...t.divisions].map(id=>state.divisions.find(d=>String(d.id)===String(id))?.title).filter(Boolean).sort();
    const divLabel=divisionId?(state.divisions.find(d=>String(d.id)===String(divisionId))?.title||''):divTitles.join(' / ');
    const key=`${normalize(t.title)}|${normalize(divLabel)}`;
    if(!groups.has(key))groups.set(key,{ids:[],title:t.title,divisionTitle:divLabel});
    groups.get(key).ids.push(String(t.id));
  }
  return[...groups.values()].sort((a,b)=>a.title.localeCompare(b.title,undefined,{numeric:true}));
}
function refreshScheduleResults(){
  const games=scheduleGames(),count=$('#scheduleCount'),root=$('#scheduleGames');
  if(count)count.textContent=`${games.length} games`;
  if(root){root.innerHTML=games.map(gameCard).join('')||'<div class="panel empty">No games match these filters.</div>';bindGameActions(root)}
  pollLive();
}
function renderSchedule(){
  const s=state.schedule;
  const divOpts=state.divisions.map(d=>`<option value="${d.id}" ${String(d.id)===String(s.division)?'selected':''}>${esc(d.title)}</option>`).join('');
  const groups=scheduleTeamGroups(s.division);
  const selectedIds=String(s.team||'').split(',').filter(Boolean);
  const teamOpts=groups.map(g=>{const selected=g.ids.some(id=>selectedIds.includes(id));const label=s.division?g.title:(g.divisionTitle?`${g.title} — ${g.divisionTitle}`:g.title);return`<option value="${escAttr(g.ids.join(','))}" ${selected?'selected':''}>${esc(label)}</option>`}).join('');
  const rinks=[...new Set(state.games.map(g=>g.location?.trim()).filter(Boolean))].sort();
  const games=scheduleGames();
  els.scheduleView.innerHTML=`<div class="heading"><div><h1>Schedule</h1><p>Full league schedule and filters.</p></div><div id="scheduleCount" class="count">${games.length} games</div></div><section class="panel filters"><div class="filtergrid"><div><label class="label">Division</label><select id="fDiv"><option value="">All divisions</option>${divOpts}</select></div><div><label class="label">Team</label><select id="fTeam"><option value="">All teams</option>${teamOpts}</select></div><div><label class="label">When</label><select id="fWhen"><option value="upcoming" ${s.when==='upcoming'?'selected':''}>Upcoming</option><option value="today" ${s.when==='today'?'selected':''}>Today</option><option value="weekend" ${s.when==='weekend'?'selected':''}>This weekend</option><option value="next7" ${s.when==='next7'?'selected':''}>Next 7 days</option><option value="all" ${s.when==='all'?'selected':''}>Entire season</option></select></div><div><label class="label">Rink</label><select id="fRink"><option value="">All rinks</option>${rinks.map(r=>`<option value="${escAttr(r)}" ${r===s.rink?'selected':''}>${esc(r)}</option>`).join('')}</select></div><div class="wide"><label class="label">Search</label><input id="fSearch" type="search" value="${escAttr(s.search)}" placeholder="PNY september 13"></div></div><div class="checkrow"><label><input id="fMine" type="checkbox" ${s.myTeam?'checked':''}> My Team only</label><label><input id="fFav" type="checkbox" ${s.faves?'checked':''}> Favorite venues only</label><label><input id="fSched" type="checkbox" ${s.scheduled?'checked':''}> Scheduled only</label><button id="setTeamFromFilter" class="soft" ${s.team?'':'disabled'}>Set selected team as My Team</button></div></section><div id="scheduleGames" class="list">${games.map(gameCard).join('')||'<div class="panel empty">No games match these filters.</div>'}</div>`;
  bindGameActions(els.scheduleView);
  const simpleRefresh=()=>{state.schedule.rink=$('#fRink').value;state.schedule.when=$('#fWhen').value;state.schedule.search=$('#fSearch').value;state.schedule.myTeam=$('#fMine').checked;state.schedule.faves=$('#fFav').checked;state.schedule.scheduled=$('#fSched').checked;refreshScheduleResults()};
  $('#fDiv').onchange=()=>{state.schedule.division=$('#fDiv').value;state.schedule.team='';renderSchedule()};
  $('#fTeam').onchange=()=>{state.schedule.team=$('#fTeam').value;const setBtn=$('#setTeamFromFilter');if(setBtn)setBtn.disabled=!state.schedule.team;refreshScheduleResults()};
  ['fRink','fWhen','fMine','fFav','fSched'].forEach(id=>$(id).onchange=simpleRefresh);
  $('#fSearch').oninput=()=>{state.schedule.search=$('#fSearch').value;refreshScheduleResults()};
  $('#setTeamFromFilter').onclick=()=>{const ids=String(state.schedule.team||'').split(',').filter(Boolean);if(!ids.length)return;state.myTeamBySeason[state.seasonId]=ids[0];savePrefs();refreshScheduleResults()};
}
function scheduleGames()'''
          s,count=schedule_re.subn(schedule_new,s,count=1)
          if count!=1: raise RuntimeError(f'schedule replacement count {count}')
          once("if(s.team&&!hasTeam(g,s.team))return false;","if(s.team&&!String(s.team).split(',').filter(Boolean).some(id=>hasTeam(g,id)))return false;",'grouped team filter')

          # Add follow/unfollow stars to the player table in game stats.
          player_re=re.compile(r"function playerTable\(b\)\{.*?\nfunction esc\(v\)",re.S)
          player_new=r'''function statsPlayerRecord(p,team){const n=normStatPlayer(p),pos=String(n.position||'');return{id:String(n.id??''),name:pname(n),kind:pos.toLowerCase().includes('goalie')?'goalie':'skater',number:n.number??n.jersey??'',position:pos,teamId:String(team?.id??''),teamTitle:team?.title||'',teamLogo:team?.logo||'',teamAbbr:team?.abbr||'',divisionId:String(team?.division?.id??''),divisionTitle:team?.division?.title||'',photo:n.photoURL||'',g:n.g??0,a:n.a??0,pts:n.pts??0,pim:n.pim??0,sog:n.sog??n.shots??'—',gaa:n.gaa??'—',svPct:n.savePct??n.svPct??'—',w:n.w??n.wins??'—',so:n.so??n.shutouts??'—'}}
function playerTable(b){const favs=favPlayerMap(),rows=[...(b.visitor?.roster?.players||[]).map(p=>({...normStatPlayer(p),_team:b.visitor?.title||'Away',_side:'visitor'})),...(b.home?.roster?.players||[]).map(p=>({...normStatPlayer(p),_team:b.home?.title||'Home',_side:'home'}))];if(!rows.length)return'<div class="empty" style="padding:16px">No roster data reported.</div>';return`<div style="overflow:auto"><table><thead><tr><th></th><th>Team</th><th>Player</th><th>#</th><th>G</th><th>A</th><th>PTS</th><th>PIM</th></tr></thead><tbody>${rows.map(p=>`<tr><td><button class="star player-follow ${favs[String(p.id)]?'active':''}" data-player="${escAttr(p.id)}" data-side="${p._side}" title="${favs[String(p.id)]?'Unfollow player':'Follow player'}">${favs[String(p.id)]?'★':'☆'}</button></td><td>${esc(p._team)}</td><td>${esc(pname(p))}</td><td>${esc(p.number||p.jersey||'')}</td><td>${esc(p.g??0)}</td><td>${esc(p.a??0)}</td><td>${esc(p.pts??0)}</td><td>${esc(p.pim??0)}</td></tr>`).join('')}</tbody></table></div>`}
function esc(v)'''
          s,count=player_re.subn(player_new,s,count=1)
          if count!=1: raise RuntimeError(f'player table replacement count {count}')

          once("function renderStats(g,b){const away=b.visitor||g.visitor,home=b.home||g.home;","function renderStats(g,b){state._statsBox=b;const away=b.visitor||g.visitor,home=b.home||g.home;",'stats box state')

          # Global delegated handler ensures Add Players always works after re-renders and lets stats stars toggle follows.
          old_setup="document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>setView(b.dataset.view));els.seasonPicker.onchange=async()=>{state.seasonId=els.seasonPicker.value;savePrefs();await loadSeason()};"
          new_setup="document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>setView(b.dataset.view));document.addEventListener('click',e=>{const add=e.target.closest?.('#addPlayers');if(add){e.preventDefault();openPlayerPicker().catch(err=>console.error(err));return}const follow=e.target.closest?.('.player-follow');if(follow){e.preventDefault();const side=follow.dataset.side,id=String(follow.dataset.player||''),team=state._statsBox?.[side],p=(team?.roster?.players||[]).find(x=>String(x.id)===id);if(!p)return;const m=favPlayerMap();if(m[id])delete m[id];else m[id]=statsPlayerRecord(p,team);saveFavPlayerMap(m);follow.classList.toggle('active',!!m[id]);follow.textContent=m[id]?'★':'☆';follow.title=m[id]?'Unfollow player':'Follow player';}});els.seasonPicker.onchange=async()=>{state.seasonId=els.seasonPicker.value;savePrefs();await loadSeason()};"
          once(old_setup,new_setup,'delegated interactions')

          p.write_text(s)
          PY
      - name: Validate inline JavaScript
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          s=Path('v3.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',s,flags=re.S)
          if len(scripts)!=1: raise SystemExit(f'Expected one inline script, got {len(scripts)}')
          Path('/tmp/v3.js').write_text(scripts[0])
          PY
          node --check /tmp/v3.js
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v3.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: polish V3 mobile filters, players, and navigation"
          git push origin HEAD:main
