name: Fix V3.1 selector helper
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch selector helper and validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('v3.1.html')
          s=p.read_text()
          old="const $=id=>document.getElementById(id),els={"
          new="const $=id=>document.getElementById(String(id).replace(/^#/,'')),els={"
          if old not in s:
              raise SystemExit('selector helper target not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          scripts=re.findall(r'<script>(.*?)</script>',s,flags=re.S)
          if len(scripts)!=1:
              raise SystemExit(f'Expected one inline script, got {len(scripts)}')
          Path('/tmp/v31.js').write_text(scripts[0])
          PY
          node --check /tmp/v31.js
      - name: Commit fix and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v3.1.html
          git rm .github/workflows/fix-v31-selector-helper.yml
          git commit -m "fix: make V3.1 selector helper accept #id references"
          git push origin HEAD:main
