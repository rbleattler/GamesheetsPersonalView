name: Patch live score data
on:
  push:
    branches:
      - fix/live-score-data-and-mobile-date
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-score-data-and-mobile-date
      - name: Patch app
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          p = Path('gamesheets_plus.html')
          raw = p.read_bytes().decode('utf-8')
          eol = '\r\n' if '\r\n' in raw else '\n'
          s = raw.replace('\r\n', '\n')

          def once(old, new, label):
              global s
              if old not in s:
                  raise RuntimeError(f'Missing anchor: {label}')
              s = s.replace(old, new, 1)

          once(
          '''    .field label {
          ''',
          '''    .field {
                  min-width: 0;
              }

              .field label {
          ''',
          'field min width')

          once(
          '''    .field select,
              .field input {
                  width: 100%;
              }
          ''',
          '''    .field select,
              .field input {
                  width: 100%;
              }

              #rinkDayDate {
                  display: block;
                  width: 100%;
                  min-width: 0;
                  max-width: 100%;
              }
          ''',
          'date control sizing')

          once(
          '''        .filter-grid,
                  .rink-control-grid {
                      display: grid;
                      grid-template-columns: 1fr;
                      gap: 11px;
                  }
          ''',
          '''        .filter-grid,
                  .rink-control-grid {
                      display: grid;
                      grid-template-columns: 1fr;
                      gap: 11px;
                  }

                  .rink-control-grid > * {
                      min-width: 0;
                  }

                  #rinkDayDate::-webkit-date-and-time-value {
                      text-align: left;
                  }
          ''',
          'mobile date sizing')

          pattern = re.compile(r'''async function refreshVisibleLiveGames\(\) \{.*?\n\}\n\nfunction startLivePolling\(\) \{''', re.S)
          replacement = r'''function normalizeBoxScoreStatus(value) {
              const status = String(value ?? "")
                  .trim()
                  .toLowerCase()
                  .replace(/[_-]+/g, " ")
                  .replace(/\s+/g, " ");

              if (status.includes("progress")) return "in_progress";
              if (status === "final") return "final";
              if (status === "scheduled") return "scheduled";

              return status ? status.replace(/\s+/g, "_") : "";
          }

          function scoreValue(value, fallback) {
              if (value == null || value === "") return fallback;
              const numeric = Number(value);
              return Number.isFinite(numeric) ? numeric : value;
          }

          function applyBoxScoreSnapshot(game, boxScore) {
              const refreshed = {
                  ...game,
                  home: { ...game.home },
                  visitor: { ...game.visitor }
              };

              if (boxScore?.home) {
                  refreshed.home.goals = scoreValue(
                      boxScore.home.finalScore,
                      game.home?.goals
                  );

                  if (boxScore.home.sog != null) {
                      refreshed.home.shots = boxScore.home.sog;
                  }
              }

              if (boxScore?.visitor) {
                  refreshed.visitor.goals = scoreValue(
                      boxScore.visitor.finalScore,
                      game.visitor?.goals
                  );

                  if (boxScore.visitor.sog != null) {
                      refreshed.visitor.shots = boxScore.visitor.sog;
                  }
              }

              const freshStatus = normalizeBoxScoreStatus(boxScore?.gameStatus);
              if (freshStatus) {
                  refreshed.status = freshStatus;
              }

              return refreshed;
          }

          async function fetchLiveGameSnapshot(game) {
              const body = await fetchJson(
                  `${API}/useBoxScore/getGameStats/${state.seasonId}/games/` +
                  `${encodeURIComponent(game.gameId)}`
              );

              let boxScore = dataOf(body);
              if (Array.isArray(boxScore)) {
                  boxScore = boxScore[0];
              }

              if (!boxScore || typeof boxScore !== "object") {
                  throw new Error(`No box-score data for game ${game.gameId}`);
              }

              return applyBoxScoreSnapshot(game, boxScore);
          }

          async function refreshVisibleLiveGames() {
              if (state.livePollInFlight || document.hidden) {
                  return;
              }

              const liveGames = visibleLiveGames();

              if (!liveGames.length) {
                  updateLiveRefreshStatus();
                  return;
              }

              state.livePollInFlight = true;

              try {
                  const results = await Promise.allSettled(
                      liveGames.map(fetchLiveGameSnapshot)
                  );

                  const refreshedGames = results
                      .filter(result => result.status === "fulfilled")
                      .map(result => result.value);

                  const failures = results
                      .filter(result => result.status === "rejected");

                  if (refreshedGames.length) {
                      mergeRefreshedGames(refreshedGames);
                  }

                  if (failures.length) {
                      console.warn(
                          `${failures.length} live box-score refresh request(s) failed.`,
                          failures.map(result => result.reason)
                      );
                  }

                  state.lastLiveRefresh = new Date();

                  if (state.currentView === "rink") {
                      renderRinkDay();
                  }
                  else {
                      applyFilters();
                  }
              }
              catch (error) {
                  console.warn("Live score refresh failed:", error);
              }
              finally {
                  state.livePollInFlight = false;
                  updateLiveRefreshStatus();
              }
          }

          function startLivePolling() {'''

          s, count = pattern.subn(lambda _m: replacement, s, count=1)
          if count != 1:
              raise RuntimeError(f'Expected one refreshVisibleLiveGames block, replaced {count}')

          once(
          '''    state.livePollTimer = setInterval(
                  refreshVisibleLiveGames,
                  LIVE_REFRESH_MS
              );

              updateLiveRefreshStatus();
          }''',
          '''    state.livePollTimer = setInterval(
                  refreshVisibleLiveGames,
                  LIVE_REFRESH_MS
              );

              refreshVisibleLiveGames();
              updateLiveRefreshStatus();
          }''',
          'immediate live refresh')

          output = s.replace('\n', eol) if eol == '\r\n' else s
          p.write_bytes(output.encode('utf-8'))
          PY
      - name: Validate inline JavaScript
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          s = Path('gamesheets_plus.html').read_text()
          scripts = re.findall(r'<script>(.*?)</script>', s, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit(f'Expected 1 inline script, found {len(scripts)}')
          Path('/tmp/app.js').write_text(scripts[0])
          PY
          node --check /tmp/app.js
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gamesheets_plus.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: refresh live scores from box score data"
          git push origin HEAD:fix/live-score-data-and-mobile-date
