name: Publish stable MyHockeyHub entry
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Publish stable entry, V1 archive, index, and whats-new sheet
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          latest = Path('v3.2.2.html')
          stable = Path('gamesheets_plus.html')
          v1 = Path('v1.html')

          if not v1.exists():
              v1.write_text(stable.read_text(encoding='utf-8'), encoding='utf-8')

          s = latest.read_text(encoding='utf-8')
          marker = '/* stable-entry-whats-new */'
          if marker not in s:
              css = r'''
/* stable-entry-whats-new */
.release-sheet-backdrop{position:fixed;inset:0;background:rgba(1,7,14,.62);backdrop-filter:blur(5px);z-index:80;display:none}.release-sheet-backdrop.open{display:block}.release-sheet{position:fixed;left:50%;bottom:0;z-index:81;width:min(680px,calc(100vw - 18px));max-height:min(78dvh,720px);overflow:auto;transform:translate(-50%,105%);transition:transform .22s ease;background:linear-gradient(180deg,#102237,#0b1827);border:1px solid #31506d;border-bottom:0;border-radius:22px 22px 0 0;box-shadow:0 -24px 70px rgba(0,0,0,.48);padding:18px 18px max(22px,env(safe-area-inset-bottom));color:#f7fbff}.release-sheet.open{transform:translate(-50%,0)}.release-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.release-kicker{color:#8db7df;font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.release-sheet h2{margin:4px 0 4px;font-size:1.75rem}.release-intro{color:#a8bdd2;margin:0 0 13px}.release-items{display:grid;gap:9px}.release-item{display:grid;grid-template-columns:28px minmax(0,1fr);gap:9px;padding:9px 0;border-top:1px solid rgba(125,160,194,.15)}.release-item:first-child{border-top:0}.release-check{width:23px;height:23px;border-radius:50%;display:grid;place-items:center;background:rgba(56,232,137,.16);color:#70efaa;font-weight:900}.release-item b{display:block}.release-item span{display:block;color:#9fb5cb;font-size:.86rem;margin-top:2px}.release-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid rgba(125,160,194,.22)}.release-actions a,.release-actions button{min-height:42px;border-radius:12px;padding:9px 13px;border:1px solid #3a5775;background:#10243a;color:#eef8ff;text-decoration:none;font-weight:760}.release-actions .release-primary{background:#167fe1;border-color:#2c97ef;color:white}.release-note{font-size:.76rem;color:#829ab2;margin-top:14px}.release-close{border:1px solid #35516f;background:#12263b;color:white;border-radius:50%;width:40px;height:40px;font-size:1.35rem}.release-original{margin-top:12px;padding:11px;border-radius:13px;background:rgba(70,144,213,.09);border:1px solid rgba(80,153,219,.26);color:#b9d3ea;font-size:.86rem}
html[data-theme="light"] .release-sheet{background:linear-gradient(180deg,#fff,#f2f7fb);color:#102235;border-color:#b8cadb;box-shadow:0 -20px 60px rgba(22,54,84,.22)}html[data-theme="light"] .release-intro,html[data-theme="light"] .release-item span,html[data-theme="light"] .release-note{color:#61788f}html[data-theme="light"] .release-actions a,html[data-theme="light"] .release-actions button{background:#fff;color:#17314b;border-color:#b8cadb}html[data-theme="light"] .release-original{background:#edf6fd;color:#486982;border-color:#c4dceb}
@media(min-width:700px){.release-sheet{bottom:22px;border-bottom:1px solid #31506d;border-radius:22px}.release-sheet.open{transform:translate(-50%,0)}}
'''
              s = s.replace('\n[hidden]{display:none!important}', '\n'+css+'\n[hidden]{display:none!important}', 1)

              html = r'''
<div id="releaseBackdrop" class="release-sheet-backdrop" aria-hidden="true"></div>
<section id="releaseSheet" class="release-sheet" role="dialog" aria-modal="true" aria-labelledby="releaseTitle" aria-hidden="true">
  <div class="release-head"><div><div class="release-kicker" id="releaseKicker">Latest update</div><h2 id="releaseTitle">What’s new in V3.2.2</h2></div><button id="releaseClose" class="release-close" aria-label="Close">×</button></div>
  <p id="releaseIntro" class="release-intro">A few useful improvements landed since the previous iteration.</p>
  <div class="release-items">
    <div class="release-item"><div class="release-check">✓</div><div><b>Player event details</b><span>Expand a player’s recent game to see goal and assist periods, clock times, and context.</span></div></div>
    <div class="release-item"><div class="release-check">✓</div><div><b>GameSheet links everywhere</b><span>Game and player drill-downs now keep a small direct link to the corresponding GameSheet game page.</span></div></div>
    <div class="release-item"><div class="release-check">✓</div><div><b>Appearance settings</b><span>Choose dark, light, or follow your device from Settings.</span></div></div>
    <div class="release-item"><div class="release-check">✓</div><div><b>Clear all app data</b><span>Reset saved teams, players, venues, seasons, and appearance preferences from Settings.</span></div></div>
    <div class="release-item"><div class="release-check">✓</div><div><b>Mobile layout polish</b><span>Full-width mobile drawers and safer spacing improve centering on phones.</span></div></div>
  </div>
  <div id="releaseOriginal" class="release-original" hidden>The stable link you previously used now opens the current MyHockeyHub experience. The original viewer has been preserved as <b>V1</b> if you ever want to go back.</div>
  <div class="release-actions"><a href="index.html">Version history</a><a id="releaseV1" href="v1.html" hidden>Open original V1</a><button id="releaseGotIt" class="release-primary">Got it</button></div>
  <div class="release-note">MyHockeyHub is an independent project using publicly available GameSheet data. It is not affiliated with, endorsed by, sponsored by, or operated by GameSheet.</div>
</section>
'''
              s = s.replace('</body>', html+'\n</body>', 1)

              js = r'''

// Stable entry release notes. Shown only when arriving through gamesheets_plus.html.
(function stableEntryReleaseNotes(){
  const CURRENT='3.2.2';
  const via=new URLSearchParams(location.search).get('via');
  const key='myhockeyhub.lastSeenVersion';
  const last=localStorage.getItem(key)||'';
  const hasLegacy=!!(localStorage.getItem('dvhl.myTeamId')||localStorage.getItem('dvhl.favoriteRinks'));
  const hasModern=Object.keys(localStorage).some(k=>k.startsWith('gsv3.'));
  const sheet=document.getElementById('releaseSheet'),backdrop=document.getElementById('releaseBackdrop');
  if(!sheet||!backdrop)return;
  const close=()=>{sheet.classList.remove('open');backdrop.classList.remove('open');sheet.setAttribute('aria-hidden','true');backdrop.setAttribute('aria-hidden','true');localStorage.setItem(key,CURRENT)};
  document.getElementById('releaseClose').onclick=close;
  document.getElementById('releaseGotIt').onclick=close;
  backdrop.onclick=close;
  if(via==='latest'&&last!==CURRENT){
    const original=document.getElementById('releaseOriginal'),v1=document.getElementById('releaseV1'),title=document.getElementById('releaseTitle'),intro=document.getElementById('releaseIntro'),kicker=document.getElementById('releaseKicker');
    if(!last&&!hasModern){
      kicker.textContent='Welcome back';
      title.textContent='The original viewer grew up';
      intro.textContent='The stable link now opens MyHockeyHub V3.2.2 — the current personalized experience.';
      original.hidden=false;v1.hidden=false;
    }else if(!last&&hasLegacy){original.hidden=false;v1.hidden=false}
    requestAnimationFrame(()=>{backdrop.classList.add('open');sheet.classList.add('open');sheet.setAttribute('aria-hidden','false');backdrop.setAttribute('aria-hidden','false')});
  }else if(via!=='latest'&&!last){localStorage.setItem(key,CURRENT)}
})();
'''
              s = s.replace('\n})();\n</script>', js+'\n})();\n</script>', 1)
              latest.write_text(s, encoding='utf-8')

          stable.write_text('''<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opening MyHockeyHub…</title><meta name="robots" content="noindex"><style>html,body{height:100%;margin:0;background:#07111c;color:#f7fbff;font-family:system-ui,-apple-system,sans-serif}body{display:grid;place-items:center}.box{text-align:center;padding:24px}.spinner{width:34px;height:34px;border:3px solid #29425b;border-top-color:#55a7ff;border-radius:50%;margin:0 auto 14px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}a{color:#55a7ff}</style><script>location.replace('v3.2.2.html?via=latest');</script></head><body><div class="box"><div class="spinner"></div><strong>Opening the latest MyHockeyHub…</strong><p><a href="v3.2.2.html?via=latest">Continue</a></p></div></body></html>''', encoding='utf-8')

          index = r'''<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark light"><title>MyHockeyHub — Version History</title>
<style>
:root{--bg:#07111c;--panel:#0e1d2c;--panel2:#12263a;--line:#29445f;--text:#f6fbff;--muted:#9ab0c5;--blue:#3da0ff;--green:#43da91}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% -6%,rgba(61,160,255,.16),transparent 28rem),linear-gradient(#07111c,#091522);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(1060px,100%);margin:auto;padding:18px 16px 56px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:11px}.mark{width:48px;height:48px;border-radius:16px;background:linear-gradient(145deg,#64bcff,#2374c7);display:grid;place-items:center;font-size:25px}.brand b{font-size:1.35rem}.brand em{font-style:normal;color:var(--blue)}.stable{padding:9px 12px;border:1px solid #35546f;border-radius:999px;color:#d9ecff;text-decoration:none;font-size:.86rem}.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(280px,.7fr);gap:18px;padding:26px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(155deg,rgba(15,32,48,.96),rgba(9,20,31,.96));box-shadow:0 18px 52px rgba(0,0,0,.28)}h1{font-size:clamp(2rem,6vw,3.25rem);margin:0 0 8px;letter-spacing:-.055em}.hero p{color:var(--muted);font-size:1.05rem;line-height:1.55;margin:0 0 16px}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{display:inline-block;padding:11px 14px;border-radius:12px;border:1px solid #36536f;background:#10243a;color:white;text-decoration:none;font-weight:800}.btn.primary{background:#1683eb;border-color:#3198f1}.featurebox{border:1px solid #31506d;border-radius:17px;padding:15px;background:#0d1b2a;display:grid;gap:13px}.feature{display:grid;grid-template-columns:30px 1fr;gap:9px}.feature i{font-style:normal;font-size:1.25rem}.feature b{display:block}.feature span{color:var(--muted);font-size:.82rem}.sectionhead{margin:28px 2px 12px}.sectionhead h2{margin:0 0 3px}.sectionhead p{margin:0;color:var(--muted)}.versions{display:grid;gap:10px}.version{display:grid;grid-template-columns:88px minmax(0,1fr) auto;gap:14px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:14px;background:linear-gradient(145deg,#0e1d2c,#0b1724)}.tag{display:inline-flex;align-items:center;justify-content:center;padding:7px 9px;border-radius:10px;background:#12375a;color:#d8ecff;font-weight:900}.tag.current{background:#0b4f3b;color:#9af0c5}.desc b{display:block;margin-bottom:3px}.desc span{color:var(--muted);font-size:.88rem;line-height:1.45}.open{white-space:nowrap;padding:8px 11px;border:1px solid #335473;border-radius:10px;color:white;text-decoration:none;background:#12304c}.note{margin-top:18px;border:1px solid #28445f;border-radius:15px;padding:13px;color:#a9bed1;background:#0c1a28;font-size:.85rem}.note b{color:#eaf5ff}@media(max-width:720px){.wrap{padding:12px 10px 40px}.top{align-items:flex-start}.hero{grid-template-columns:1fr;padding:19px}.featurebox{display:grid;grid-template-columns:1fr}.version{grid-template-columns:74px 1fr}.version .open{grid-column:1/-1;text-align:center}.stable{font-size:.76rem;padding:8px 9px}.mark{width:42px;height:42px}.brand b{font-size:1.16rem}}@media(prefers-color-scheme:light){:root{--bg:#f3f7fb;--panel:#fff;--panel2:#edf4fa;--line:#c7d7e5;--text:#102235;--muted:#60778e;--blue:#086dcc}body{background:linear-gradient(#f7fafc,#edf3f8)}.hero,.version,.featurebox,.note{background:#fff;box-shadow:0 12px 32px rgba(32,60,87,.09)}.stable,.btn,.open{color:#102235;background:#fff;border-color:#b9cad9}.btn.primary{color:#fff;background:#1683eb}.tag{background:#e4f1fd;color:#21557f}.tag.current{background:#dff7eb;color:#176844}}
</style></head>
<body><main class="wrap"><header class="top"><div class="brand"><div class="mark">◉</div><div><b>MyHockey<em>Hub</em></b><div style="color:var(--muted);font-size:.8rem">Version history & design evolution</div></div></div><a class="stable" href="gamesheets_plus.html">Open latest ↗</a></header>
<section class="hero"><div><h1>Track what matters.</h1><p>Your team. Your players. Your favorite rinks. The project started as a simple way to make a huge public GameSheet schedule easier to use and gradually evolved into a personalized, mobile-first hockey companion.</p><div class="actions"><a class="btn primary" href="gamesheets_plus.html">Open latest version</a><a class="btn" href="#versions">Explore versions</a></div></div><div class="featurebox"><div class="feature"><i>👥</i><div><b>Follow your team</b><span>Schedules, results, roster, and game stats.</span></div></div><div class="feature"><i>★</i><div><b>Track your players</b><span>Season stats and recent game activity.</span></div></div><div class="feature"><i>📍</i><div><b>Save favorite rinks</b><span>See what is happening at the places you care about.</span></div></div><div class="feature"><i>🗓️</i><div><b>Browse the whole league</b><span>Full schedule, filters, live scores, and detail views.</span></div></div></div></section>
<div id="versions" class="sectionhead"><h2>Version history</h2><p>Every major iteration remains available so you can compare the direction of the project — or simply use the version you prefer.</p></div>
<section class="versions">
<div class="version"><div class="tag current">V3.2.2</div><div class="desc"><b>Player event details, appearance settings, and polish</b><span>Expandable goal/assist events in player game history, GameSheet links across game views, light/dark/device appearance, clear-all-data controls, and mobile alignment fixes.</span></div><a class="open" href="v3.2.2.html">Open V3.2.2</a></div>
<div class="version"><div class="tag">V3.2.1</div><div class="desc"><b>Roster accuracy and clearer game actions</b><span>My Team roster membership moved to actual game lineups instead of assuming missing team IDs. Scheduled venue games gained an internal Details view instead of unexpectedly opening GameSheet.</span></div><a class="open" href="v3.2.1.html">Open V3.2.1</a></div>
<div class="version"><div class="tag">V3.2</div><div class="desc"><b>Player profiles and connected stats</b><span>Browse the My Team roster, open player detail cards from names throughout the app, drill into player season stats, make Recent Results interactive, and identify teams in the scoring summary.</span></div><a class="open" href="v3.2.html">Open V3.2</a></div>
<div class="version"><div class="tag">V3.1</div><div class="desc"><b>MyHockeyHub identity and major reliability fixes</b><span>Rebranded away from GameSheets+, moved league selection into Settings, tightened schedule filtering, improved Add Players, added internal game details, and added the independent-project disclaimer.</span></div><a class="open" href="v3.1.html">Open V3.1</a></div>
<div class="version"><div class="tag">V3</div><div class="desc"><b>Personalization becomes the product model</b><span>Introduced the mobile-first My Team, Venues, Players, and Schedule destinations. Saved preferences became useful views rather than just highlights.</span></div><a class="open" href="v3.html">Open V3</a></div>
<div class="version"><div class="tag">V2</div><div class="desc"><b>Visual redesign and richer game stats</b><span>Introduced the HockeyHub-style card design, team logos with fallbacks, stronger live-score presentation, and an in-app Game Stats drawer.</span></div><a class="open" href="v2.html">Open V2</a></div>
<div class="version"><div class="tag">V1</div><div class="desc"><b>The original public schedule viewer</b><span>The proof of concept: load the public league schedule, search and filter it, favorite rinks, choose My Team, inspect rink-day schedules, and make the huge GameSheet season feed practical on a phone.</span></div><a class="open" href="v1.html">Open V1</a></div>
</section><div class="note"><b>About GameSheet:</b> MyHockeyHub is an independent project using publicly available GameSheet data. It is not affiliated with, endorsed by, sponsored by, or operated by GameSheet.</div></main></body></html>'''
          Path('index.html').write_text(index, encoding='utf-8')
          PY

          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('v3.2.2.html').read_text(encoding='utf-8')
          js='\n'.join(re.findall(r'<script>(.*?)</script>',s,re.S))
          Path('/tmp/app.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/app.js

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v1.html gamesheets_plus.html v3.2.2.html index.html
          git commit -m 'feat: add stable latest entry, V1 archive, changelog, and release notes'
          git push
