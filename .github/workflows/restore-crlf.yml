name: Restore CRLF
on:
  push:
    branches:
      - feature/live-score-refresh
permissions:
  contents: write
jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/live-score-refresh
      - name: Restore CRLF line endings
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('gamesheets_plus.html')
          data = p.read_bytes().replace(b'\r\n', b'\n').replace(b'\r', b'\n')
          p.write_bytes(data.replace(b'\n', b'\r\n'))
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gamesheets_plus.html
          git commit -m "chore: preserve source line endings"
          git push origin HEAD:feature/live-score-refresh
