name: Run V2 stats patch
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python tools/patch_v2_stats.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('v2.html').read_text()
          scripts = re.findall(r'<script>(.*?)</script>', s, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit(f'Expected one inline script, got {len(scripts)}')
          Path('/tmp/v2.js').write_text(scripts[0])
          PY
          node --check /tmp/v2.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: load V2 game stats from Firestore game state"
          git push origin HEAD:main
