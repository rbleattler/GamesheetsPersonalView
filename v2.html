<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>GameSheet Personal View — V2</title>
<style>
:root{
  --bg:#08111c;--bg2:#0b1623;--panel:#101c2a;--panel2:#142233;--line:#26384d;
  --text:#f7fbff;--muted:#91a5be;--blue:#55a7ff;--blue2:#1f7de0;--green:#38e889;
  --red:#ff3b3b;--amber:#ffbd3e;--shadow:0 18px 50px rgba(0,0,0,.35);
}
*{box-sizing:border-box} html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;color:var(--text);background:
 radial-gradient(circle at 15% -10%,rgba(51,124,211,.16),transparent 28rem),
 linear-gradient(180deg,#07101a 0%,#09131f 100%);
 font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
button,input,select{font:inherit} button{cursor:pointer}.app{width:min(1180px,100%);margin:auto;padding:18px 18px 64px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 0 18px}
.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:43px;height:43px;border-radius:14px;background:linear-gradient(145deg,#6fc0ff,#2576c9);display:grid;place-items:center;box-shadow:0 10px 30px rgba(49,145,241,.22);font-size:25px}.brand-name{font-weight:850;font-size:1.28rem;letter-spacing:-.03em}.brand-name em{font-style:normal;color:var(--blue)}.brand-sub{color:var(--muted);font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;margin-top:1px}
.beta{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:#bfd6ee;border:1px solid var(--line);padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.025)}
.panel{background:linear-gradient(180deg,rgba(18,31,46,.96),rgba(13,24,37,.96));border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.controls{padding:15px;margin-bottom:18px}.label{display:block;color:var(--muted);font-size:.76rem;font-weight:700;margin:0 0 6px 2px;text-transform:uppercase;letter-spacing:.06em}
select,input[type=search],input[type=date]{width:100%;min-height:46px;border:1px solid #30445d;border-radius:12px;background:#0c1826;color:var(--text);padding:10px 13px;outline:none}select:focus,input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(85,167,255,.12)}
.league-row{display:grid;grid-template-columns:1fr auto;gap:9px;margin-bottom:12px}.add-btn,.soft-btn,.nav-btn,.stats-btn{border:1px solid #30445d;border-radius:12px;background:#0c1826;color:var(--text);padding:10px 14px;min-height:44px}.add-btn:hover,.soft-btn:hover,.nav-btn:hover,.stats-btn:hover{background:#122338}.filter-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.field{min-width:0}.field.search{grid-column:auto}.check-row{display:flex;flex-wrap:wrap;gap:12px 18px;margin-top:12px;color:#bdcce0;font-size:.85rem}.check{display:flex;align-items:center;gap:7px}.check input{accent-color:var(--blue)}
.viewbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:18px 0 12px}.views{display:flex;gap:5px;padding:4px;background:#0b1724;border:1px solid var(--line);border-radius:13px}.nav-btn{min-height:36px;padding:7px 14px;border:0;background:transparent;color:var(--muted)}.nav-btn.active{background:#1a3550;color:white}.statusline{color:var(--muted);font-size:.82rem;text-align:right}.statusline.live{color:#ff7777;font-weight:700}
.heading{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:18px 2px 12px}.heading h1{font-size:clamp(1.8rem,5vw,2.8rem);letter-spacing:-.055em;margin:0}.heading .count{color:var(--muted);font-size:1rem}
.games{display:grid;gap:14px}.game-card{position:relative;overflow:hidden;border:1px solid #2a4057;border-radius:20px;background:linear-gradient(155deg,rgba(19,34,50,.98),rgba(10,19,30,.98));box-shadow:0 13px 38px rgba(0,0,0,.28);transition:.2s transform,.2s border-color}.game-card:hover{border-color:#3b5b7d}.game-card.my-team{box-shadow:inset 0 0 0 1px rgba(255,189,62,.42),0 13px 38px rgba(0,0,0,.28)}.game-card.live{border-color:rgba(255,59,59,.8);box-shadow:inset 4px 0 0 var(--red),0 18px 44px rgba(0,0,0,.32)}
.card-head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:15px 17px;border-bottom:1px solid rgba(112,143,176,.18);background:linear-gradient(90deg,rgba(70,115,160,.08),rgba(255,255,255,.01))}.when{display:flex;align-items:center;gap:12px}.date-icon{width:38px;height:38px;border-radius:11px;background:#12263a;display:grid;place-items:center;color:var(--blue);font-size:20px}.date-main{font-weight:800;font-size:1rem}.date-time{color:var(--muted);font-size:.9rem;margin-top:2px}.badge{padding:7px 13px;border-radius:999px;font-size:.76rem;font-weight:850;letter-spacing:.08em;text-transform:uppercase;border:1px solid #2f465e;background:#112032;color:#bdd0e3}.badge.final{color:var(--green);border-color:rgba(56,232,137,.48);background:rgba(20,106,68,.2)}.badge.live{color:white;background:var(--red);border-color:var(--red);box-shadow:0 0 0 5px rgba(255,59,59,.09)}.badge.scheduled{color:#a9d6ff;border-color:#376794;background:#0e2c48}
.matchup{padding:16px 17px 13px;display:grid;gap:7px}.team-row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:12px;min-height:56px;padding:7px 8px;border-radius:14px}.team-row.primary{background:linear-gradient(90deg,rgba(62,133,206,.08),transparent)}.live .team-row{background:linear-gradient(90deg,rgba(255,59,59,.08),transparent)}.logo-shell{width:48px;height:48px;display:grid;place-items:center;border-radius:50%;background:#142538;border:1px solid #2f4966;overflow:hidden;position:relative}.logo-shell img{width:88%;height:88%;object-fit:contain}.logo-fallback{font-weight:900;color:#d9e9fa;font-size:.82rem}.team-title{font-size:clamp(1rem,2vw,1.18rem);font-weight:820;line-height:1.15}.team-side{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;margin-top:4px}.score{font-size:clamp(1.8rem,5vw,2.6rem);font-weight:900;min-width:46px;text-align:right;letter-spacing:-.05em}.live .score{color:#fff;text-shadow:0 0 22px rgba(255,59,59,.34)}
.meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid rgba(112,143,176,.18);margin:0 17px;padding:13px 0;gap:10px}.meta-item{min-width:0}.meta-k{font-size:.67rem;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;font-weight:760}.meta-v{font-size:.9rem;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.star-btn{border:0;background:none;color:#7f95ad;padding:0;font-size:1.15rem;vertical-align:-1px}.star-btn.active{color:var(--amber)}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 17px 15px}.game-link{color:var(--blue);text-decoration:none;font-weight:750;font-size:.87rem}.stats-btn{display:flex;align-items:center;gap:8px;color:#dceaf8;background:#13263a;min-height:38px;padding:7px 12px}.stats-btn strong{color:var(--blue)}
.empty{padding:42px 18px;text-align:center;color:var(--muted)}
.rink-tools{display:grid;grid-template-columns:1.5fr 1fr auto;gap:10px;padding:14px;margin-bottom:14px}.day-buttons{display:flex;gap:7px;align-items:end}.day-buttons button{flex:1}.rink-title{font-size:1.5rem;font-weight:850;margin:18px 2px 4px}.rink-sub{color:var(--muted);margin:0 2px 14px}
.drawer-backdrop{position:fixed;inset:0;background:rgba(1,6,12,.68);backdrop-filter:blur(7px);z-index:50;display:none}.drawer-backdrop.open{display:block}.drawer{position:fixed;z-index:51;right:0;top:0;height:100dvh;width:min(760px,94vw);transform:translateX(105%);transition:transform .25s ease;background:linear-gradient(180deg,#0e1a28,#09131f);border-left:1px solid #2b425b;box-shadow:-24px 0 70px rgba(0,0,0,.5);overflow:auto;padding:max(18px,env(safe-area-inset-top)) 18px max(28px,env(safe-area-inset-bottom))}.drawer.open{transform:none}.drawer-head{display:flex;justify-content:space-between;align-items:start;gap:14px;position:sticky;top:-18px;background:linear-gradient(180deg,#0e1a28 78%,rgba(14,26,40,0));z-index:3;padding:18px 0 16px}.drawer h2{font-size:1.7rem;margin:0;letter-spacing:-.04em}.drawer-sub{color:var(--muted);font-size:.88rem;margin-top:4px}.close{width:42px;height:42px;border-radius:50%;border:1px solid #31475f;background:#132235;color:white;font-size:1.5rem}.drawer-score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:17px;border:1px solid var(--line);border-radius:17px;background:#101e2d}.drawer-team{text-align:center}.drawer-team .logo-shell{margin:auto}.drawer-team-name{font-weight:800;margin-top:7px;font-size:.86rem}.drawer-scorebox{font-size:2.7rem;font-weight:950;white-space:nowrap}.drawer-scorebox span{color:var(--muted);font-weight:500;margin:0 7px}.tabs{display:flex;gap:5px;overflow:auto;border-bottom:1px solid var(--line);margin:18px 0 14px}.tab{border:0;background:none;color:var(--muted);padding:10px 12px;border-bottom:3px solid transparent;white-space:nowrap}.tab.active{color:var(--blue);border-color:var(--blue);font-weight:800}.stats-pane{display:none}.stats-pane.active{display:block}.section{border:1px solid var(--line);background:#0e1a28;border-radius:16px;padding:13px;margin-bottom:12px}.section h3{margin:0 0 10px;font-size:1rem}.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat-box{padding:10px;border-radius:12px;background:#132234;text-align:center}.stat-box .k{font-size:.65rem;color:var(--muted);text-transform:uppercase}.stat-box .v{font-size:1.1rem;font-weight:850;margin-top:3px}.event-list{display:grid;gap:7px}.event{display:grid;grid-template-columns:48px 54px minmax(0,1fr);gap:8px;padding:9px;border-radius:11px;background:#122033}.event-time,.event-period{color:var(--muted);font-size:.8rem}.event-title{font-size:.88rem;line-height:1.35}.player-table{width:100%;border-collapse:collapse;font-size:.84rem}.player-table th,.player-table td{text-align:left;padding:8px 6px;border-bottom:1px solid rgba(120,150,180,.14)}.player-table th{color:var(--muted);font-size:.68rem;text-transform:uppercase}.loading{padding:30px;text-align:center;color:var(--muted)}.error{padding:13px;border-radius:12px;background:rgba(255,59,59,.1);color:#ff9b9b;border:1px solid rgba(255,59,59,.25)}
@media(max-width:900px){.filter-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.field.search{grid-column:1/-1}.meta{grid-template-columns:repeat(2,minmax(0,1fr))}.rink-tools{grid-template-columns:1fr 1fr}.day-buttons{grid-column:1/-1}.drawer{width:min(720px,100vw)}}
@media(max-width:560px){.app{padding:11px 11px 48px}.brand-sub{display:none}.beta{font-size:.62rem}.controls{padding:11px}.league-row{grid-template-columns:1fr}.add-btn{width:100%}.filter-grid{grid-template-columns:1fr 1fr}.field.search{grid-column:1/-1}.viewbar{align-items:flex-start;flex-direction:column}.statusline{text-align:left}.heading{margin-top:14px}.card-head{padding:12px}.matchup{padding:12px 11px 10px}.team-row{grid-template-columns:44px minmax(0,1fr) auto;gap:9px}.logo-shell{width:42px;height:42px}.team-title{font-size:.98rem}.score{font-size:1.85rem}.meta{margin:0 12px;padding:11px 0;grid-template-columns:1fr 1fr}.card-foot{padding:0 12px 12px}.stats-btn{padding:6px 9px}.rink-tools{grid-template-columns:1fr}.day-buttons{grid-column:auto}.drawer{padding-left:12px;padding-right:12px}.drawer-score{padding:12px}.drawer-scorebox{font-size:2rem}.stat-grid{grid-template-columns:1fr 1fr}.event{grid-template-columns:42px 48px minmax(0,1fr)}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="brand-mark">◉</div><div><div class="brand-name">Hockey<em>Hub</em></div><div class="brand-sub">GameSheet Personal View</div></div></div>
    <div class="beta">V2 preview</div>
  </header>

  <section class="panel controls">
    <label class="label" for="seasonPicker">League / season</label>
    <div class="league-row">
      <select id="seasonPicker"></select>
      <button id="addSeason" class="add-btn">＋ Add season</button>
    </div>
    <div class="filter-grid">
      <div class="field"><label class="label" for="divisionFilter">Division</label><select id="divisionFilter"><option value="">All divisions</option></select></div>
      <div class="field"><label class="label" for="teamFilter">Team</label><select id="teamFilter"><option value="">All teams</option></select></div>
      <div class="field"><label class="label" for="whenFilter">When</label><select id="whenFilter"><option value="upcoming">Upcoming</option><option value="today">Today</option><option value="weekend">This weekend</option><option value="next7">Next 7 days</option><option value="all">Entire season</option></select></div>
      <div class="field"><label class="label" for="rinkFilter">Rink</label><select id="rinkFilter"><option value="">All rinks</option></select></div>
      <div class="field search"><label class="label" for="searchFilter">Search</label><input id="searchFilter" type="search" placeholder="PNY september 13"></div>
    </div>
    <div class="check-row">
      <label class="check"><input id="myTeamOnly" type="checkbox"> My team only</label>
      <label class="check"><input id="favoriteRinksOnly" type="checkbox"> Favorite rinks only</label>
      <label class="check"><input id="scheduledOnly" type="checkbox"> Scheduled only</label>
      <button id="setMyTeam" class="soft-btn" disabled>Set selected team as My Team</button>
    </div>
  </section>

  <div class="viewbar">
    <div class="views"><button id="scheduleTab" class="nav-btn active">Schedule</button><button id="rinkTab" class="nav-btn">Rink Day</button></div>
    <div id="liveStatus" class="statusline"></div>
  </div>

  <main id="scheduleView">
    <div class="heading"><h1>Games</h1><div id="gameCount" class="count"></div></div>
    <div id="games" class="games"></div>
  </main>

  <main id="rinkView" hidden>
    <section class="panel rink-tools">
      <div><label class="label" for="rinkDayRink">Rink</label><select id="rinkDayRink"><option value="">Choose a rink…</option></select></div>
      <div><label class="label" for="rinkDayDate">Date</label><input id="rinkDayDate" type="date"></div>
      <div class="day-buttons"><button id="prevDay" class="soft-btn">← Previous</button><button id="todayBtn" class="soft-btn">Today</button><button id="nextDay" class="soft-btn">Next →</button></div>
    </section>
    <div id="rinkTitle" class="rink-title">Choose a rink</div><div id="rinkSub" class="rink-sub">Select a rink and date.</div>
    <div id="rinkGames" class="games"></div>
  </main>
</div>

<div id="drawerBackdrop" class="drawer-backdrop"></div>
<aside id="statsDrawer" class="drawer" aria-hidden="true">
  <div class="drawer-head"><div><h2>Game Stats</h2><div id="drawerSub" class="drawer-sub"></div></div><button id="closeDrawer" class="close" aria-label="Close">×</button></div>
  <div id="drawerBody" class="loading">Select a game to view stats.</div>
</aside>

<script>
(() => {
'use strict';
const API='https://gamesheetstats.com/api';
const LIVE_MS=30000;
const DEFAULT_SEASONS=[
  {id:'15111',title:'Delaware Valley Hockey League — 2026–2027'},
  {id:'10294',title:'Delaware Valley Hockey League — 2025–2026'}
];
const state={seasonId:localStorage.getItem('gsv2.seasonId')||'15111',season:null,divisions:[],games:[],teams:[],view:'schedule',myTeamBySeason:JSON.parse(localStorage.getItem('gsv2.myTeamBySeason')||'{}'),favoriteRinks:new Set(JSON.parse(localStorage.getItem('gsv2.favoriteRinks')||'[]')),poll:null,polling:false,lastLive:null,lastError:null,boxScore:null,boxGame:null,statsTab:'summary'};
if(!state.myTeamBySeason['15111']&&localStorage.getItem('dvhl.myTeamId')) state.myTeamBySeason['15111']=localStorage.getItem('dvhl.myTeamId');
const $=id=>document.getElementById(id);
const els=['seasonPicker','addSeason','divisionFilter','teamFilter','whenFilter','rinkFilter','searchFilter','myTeamOnly','favoriteRinksOnly','scheduledOnly','setMyTeam','scheduleTab','rinkTab','liveStatus','scheduleView','rinkView','gameCount','games','rinkDayRink','rinkDayDate','prevDay','todayBtn','nextDay','rinkTitle','rinkSub','rinkGames','drawerBackdrop','statsDrawer','closeDrawer','drawerSub','drawerBody'].reduce((o,id)=>(o[id]=$(id),o),{});

function catalog(){const extra=JSON.parse(localStorage.getItem('gsv2.seasons')||'[]');const m=new Map([...DEFAULT_SEASONS,...extra].map(x=>[String(x.id),x]));return [...m.values()];}
function saveCatalog(item){const list=catalog().filter(x=>!DEFAULT_SEASONS.some(d=>String(d.id)===String(x.id)));const m=new Map(list.map(x=>[String(x.id),x]));m.set(String(item.id),item);localStorage.setItem('gsv2.seasons',JSON.stringify([...m.values()]));}
function populateSeasonPicker(){const list=catalog();els.seasonPicker.innerHTML='';for(const s of list){const o=document.createElement('option');o.value=String(s.id);o.textContent=s.title||`Season ${s.id}`;els.seasonPicker.appendChild(o)}if(!list.some(x=>String(x.id)===state.seasonId)){const o=document.createElement('option');o.value=state.seasonId;o.textContent=`Season ${state.seasonId}`;els.seasonPicker.appendChild(o)}els.seasonPicker.value=state.seasonId;}
async function addSeason(){const raw=prompt('Paste a GameSheet season URL or season ID:');if(!raw)return;const m=String(raw).match(/(?:seasons\/)?(\d{3,})/);if(!m){alert('I could not find a season ID in that value.');return}const id=m[1];try{const info=firstData(await fetchJson(`${API}/season-info/${id}`));if(!info)throw new Error('Season not found');const item={id:String(info.id||id),title:info.title||`Season ${id}`};saveCatalog(item);state.seasonId=String(item.id);localStorage.setItem('gsv2.seasonId',state.seasonId);populateSeasonPicker();await loadSeason();}catch(e){alert(`Could not load that GameSheet season.\n\n${e.message}`)}}
async function fetchJson(url){const r=await fetch(url,{cache:'no-store',credentials:'omit'});if(!r.ok)throw new Error(`${r.status} ${r.statusText}`);const b=await r.json();if(b&&typeof b==='object'&&'status'in b&&b.status!=='success')throw new Error(b.message||b.error||`GameSheet status ${b.status}`);return b}
function firstData(body){let d=body&&typeof body==='object'&&'data'in body?body.data:body;return Array.isArray(d)?d[0]:d}
function dataOf(body){return body&&typeof body==='object'&&'data'in body?body.data:body}

async function loadSeason(){clearInterval(state.poll);state.lastLive=null;state.lastError=null;els.games.innerHTML='<div class="panel loading">Loading games…</div>';els.rinkGames.innerHTML='';try{const [i,d,g]=await Promise.all([fetchJson(`${API}/season-info/${state.seasonId}`),fetchJson(`${API}/season-divisions/${state.seasonId}`),fetchJson(`${API}/unified-games/${state.seasonId}`)]);state.season=firstData(i);state.divisions=dataOf(d)||[];state.games=dedupe(dataOf(g)||[]);if(state.season){saveCatalog({id:String(state.season.id||state.seasonId),title:state.season.title||`Season ${state.seasonId}`});populateSeasonPicker()}buildTeams();populateFilters();render();startPolling();}catch(e){els.games.innerHTML=`<div class="panel error">Could not load this season: ${esc(e.message)}</div>`;els.liveStatus.textContent='Load failed'}}
function dedupe(games){const m=new Map();for(const g of games)m.set(String(g.gameId??`${g.timeStampZulu}|${g.home?.id}|${g.visitor?.id}`),g);return [...m.values()]}
function buildTeams(){const m=new Map();for(const g of state.games){for(const t of [g.home,g.visitor]){if(!t?.id)continue;const id=String(t.id);if(!m.has(id))m.set(id,{id,title:t.title||`Team ${id}`,logo:t.logo||'',abbr:t.abbr||'',divisions:new Set()});if(t.division?.id)m.get(id).divisions.add(String(t.division.id));if(t.logo&&!m.get(id).logo)m.get(id).logo=t.logo}}state.teams=[...m.values()].sort((a,b)=>a.title.localeCompare(b.title,undefined,{numeric:true}))}
function populateFilters(){fillSelect(els.divisionFilter,state.divisions.map(x=>({value:String(x.id),label:x.title})),'All divisions');populateTeams();const rinks=[...new Set(state.games.map(g=>g.location?.trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));fillSelect(els.rinkFilter,rinks.map(x=>({value:x,label:(state.favoriteRinks.has(x)?'★ ':'')+x})),'All rinks');fillSelect(els.rinkDayRink,rinks.map(x=>({value:x,label:x})),'Choose a rink…');if(!els.rinkDayDate.value)els.rinkDayDate.value=localStorage.getItem('gsv2.rinkDate')||dateKey(new Date());const savedRink=localStorage.getItem('gsv2.rink');if(savedRink&&rinks.includes(savedRink))els.rinkDayRink.value=savedRink;updateMyTeamButton()}
function fillSelect(el,items,first){const old=el.value;el.innerHTML=`<option value="">${esc(first)}</option>`;for(const x of items){const o=document.createElement('option');o.value=x.value;o.textContent=x.label;el.appendChild(o)}if([...el.options].some(o=>o.value===old))el.value=old}
function populateTeams(){const d=els.divisionFilter.value;const items=(d?state.teams.filter(t=>t.divisions.has(d)):state.teams).map(t=>({value:t.id,label:t.title}));fillSelect(els.teamFilter,items,'All teams');updateMyTeamButton()}
function updateMyTeamButton(){els.setMyTeam.disabled=!els.teamFilter.value}
function myTeamId(){return state.myTeamBySeason[state.seasonId]||''}
function gameHasTeam(g,id){return id&&(String(g.home?.id)===String(id)||String(g.visitor?.id)===String(id))}
function gameDivisions(g){return new Set([g.home?.division?.id,g.visitor?.division?.id].filter(Boolean).map(String))}
function status(g){return String(g?.status||'').trim().toLowerCase().replace(/[_-]+/g,' ').replace(/\s+/g,' ')}
function isLive(g){const s=status(g);return s==='live'||s==='playing'||s==='active'||s.includes('in progress')||s.startsWith('period ')}
function gameDate(g){return new Date(g.timeStampZulu||`${g.date||''} ${g.time||''}`)}
function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function normalize(v){return String(v??'').normalize('NFKD').toLowerCase().replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim()}
function searchText(g){const d=gameDate(g),months=[['january','jan'],['february','feb'],['march','mar'],['april','apr'],['may'],['june','jun'],['july','jul'],['august','aug'],['september','sep','sept'],['october','oct'],['november','nov'],['december','dec']],days=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];return normalize([g.number,g.gameId,g.location,g.home?.title,g.visitor?.title,g.home?.abbr,g.visitor?.abbr,g.home?.division?.title,g.visitor?.division?.title,g.gameType,g.status,days[d.getDay()],...months[d.getMonth()],d.getDate(),d.getFullYear(),`${d.getMonth()+1}/${d.getDate()}`,dateKey(d)].join(' '))}
function matchesSearch(g,q){const terms=normalize(q).split(' ').filter(Boolean),h=searchText(g);return terms.every(t=>h.includes(t))}
function matchesWhen(g,mode){const d=gameDate(g),now=new Date();if(mode==='all')return true;if(mode==='upcoming')return isLive(g)||d>=now;if(mode==='today')return dateKey(d)===dateKey(now);if(mode==='next7'){const e=new Date(now);e.setDate(e.getDate()+7);return d>=now&&d<=e}if(mode==='weekend'){const s=new Date(now);s.setHours(0,0,0,0);const day=s.getDay();if(day===0)s.setDate(s.getDate()-1);else if(day!==6)s.setDate(s.getDate()+6-day);const e=new Date(s);e.setDate(e.getDate()+1);e.setHours(23,59,59,999);return d>=s&&d<=e}return true}
function filteredGames(){const d=els.divisionFilter.value,t=els.teamFilter.value,r=els.rinkFilter.value,q=els.searchFilter.value;return state.games.filter(g=>{if(d&&!gameDivisions(g).has(d))return false;if(t&&!gameHasTeam(g,t))return false;if(els.myTeamOnly.checked&&!gameHasTeam(g,myTeamId()))return false;if(r&&g.location?.trim()!==r)return false;if(els.favoriteRinksOnly.checked&&!state.favoriteRinks.has(g.location?.trim()))return false;if(els.scheduledOnly.checked&&status(g)!=='scheduled')return false;if(!matchesWhen(g,els.whenFilter.value))return false;return matchesSearch(g,q)}).sort((a,b)=>gameDate(a)-gameDate(b))}
function rinkGames(){const r=els.rinkDayRink.value,d=els.rinkDayDate.value;if(!r||!d)return[];return state.games.filter(g=>g.location?.trim()===r&&dateKey(gameDate(g))===d).sort((a,b)=>gameDate(a)-gameDate(b))}
function currentGames(){return state.view==='rink'?rinkGames():filteredGames()}
function visibleLive(){return currentGames().filter(isLive)}
function formatDate(d){return new Intl.DateTimeFormat(undefined,{weekday:'short',month:'short',day:'numeric'}).format(d)}
function formatLongDate(d){return new Intl.DateTimeFormat(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'}).format(d)}
function formatTime(d){return new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit'}).format(d)}
function pretty(v){return String(v??'').replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase())}
function abbr(t){return (t?.abbr||String(t?.title||'').split(/\s+/).filter(Boolean).slice(0,3).map(x=>x[0]).join('')).slice(0,4).toUpperCase()||'TEAM'}
function logoHtml(t){const a=esc(abbr(t));if(t?.logo)return `<span class="logo-shell"><img src="${escAttr(t.logo)}" alt="" loading="lazy" onerror="this.remove();this.parentElement.querySelector('.logo-fallback').hidden=false"><span class="logo-fallback" hidden>${a}</span></span>`;return `<span class="logo-shell"><span class="logo-fallback">${a}</span></span>`}
function badgeHtml(g){if(isLive(g))return '<span class="badge live">● Live</span>';const s=status(g);return `<span class="badge ${s==='final'?'final':s==='scheduled'?'scheduled':''}">${esc(pretty(g.status||'Scheduled'))}</span>`}
function division(g){const a=g.visitor?.division?.title,b=g.home?.division?.title;return a===b?(a||''):[a,b].filter(Boolean).join(' / ')}
function gameCard(g){const d=gameDate(g),mine=gameHasTeam(g,myTeamId()),live=isLive(g),rink=g.location?.trim()||'',fav=state.favoriteRinks.has(rink),gameUrl=`https://gamesheetstats.com/seasons/${encodeURIComponent(state.seasonId)}/games/${encodeURIComponent(g.gameId)}`;return `<article class="game-card${mine?' my-team':''}${live?' live':''}">
<div class="card-head"><div class="when"><div class="date-icon">▣</div><div><div class="date-main">${esc(formatDate(d))}</div><div class="date-time">${esc(formatTime(d))}</div></div></div>${badgeHtml(g)}</div>
<div class="matchup">
<div class="team-row primary">${logoHtml(g.visitor)}<div><div class="team-title">${esc(g.visitor?.title||'Visitor')}</div><div class="team-side">Away</div></div><div class="score">${status(g)==='scheduled'?'—':esc(g.visitor?.goals??'')}</div></div>
<div class="team-row">${logoHtml(g.home)}<div><div class="team-title">${esc(g.home?.title||'Home')}</div><div class="team-side">Home</div></div><div class="score">${status(g)==='scheduled'?'—':esc(g.home?.goals??'')}</div></div>
</div>
<div class="meta"><div class="meta-item"><div class="meta-k">Division</div><div class="meta-v">${esc(division(g))}</div></div><div class="meta-item"><div class="meta-k">Rink</div><div class="meta-v"><button class="star-btn${fav?' active':''}" data-rink="${escAttr(rink)}" title="Favorite rink">${fav?'★':'☆'}</button> ${esc(rink||'—')}</div></div><div class="meta-item"><div class="meta-k">Type</div><div class="meta-v">${esc(pretty(g.gameType))}</div></div><div class="meta-item"><div class="meta-k">Game</div><div class="meta-v">${esc(g.number||g.gameId)}</div></div></div>
<div class="card-foot"><a class="game-link" target="_blank" rel="noopener" href="${gameUrl}">Open on GameSheet ↗</a><button class="stats-btn" data-game-id="${escAttr(g.gameId)}">▥ <strong>View stats</strong></button></div></article>`}
function renderCards(target,games){target.innerHTML=games.length?games.map(gameCard).join(''):'<div class="panel empty">No games match this view.</div>';target.querySelectorAll('.star-btn').forEach(b=>b.onclick=e=>{e.stopPropagation();toggleRink(b.dataset.rink)});target.querySelectorAll('.stats-btn').forEach(b=>b.onclick=()=>openStats(b.dataset.gameId))}
function render(){if(state.view==='schedule'){const g=filteredGames();els.gameCount.textContent=`${g.length.toLocaleString()} ${g.length===1?'game':'games'}`;renderCards(els.games,g)}else{const g=rinkGames(),r=els.rinkDayRink.value,d=els.rinkDayDate.value;els.rinkTitle.textContent=r||'Choose a rink';els.rinkSub.textContent=r&&d?`${formatLongDate(new Date(d+'T12:00:00'))} · ${g.length} ${g.length===1?'game':'games'}`:'Select a rink and date.';renderCards(els.rinkGames,g)}updateLiveStatus()}
function toggleRink(r){if(!r)return;if(state.favoriteRinks.has(r))state.favoriteRinks.delete(r);else state.favoriteRinks.add(r);localStorage.setItem('gsv2.favoriteRinks',JSON.stringify([...state.favoriteRinks]));populateFilters();render()}
function updateLiveStatus(){const n=visibleLive().length;if(!n){els.liveStatus.textContent=`Loaded ${state.games.length.toLocaleString()} games`;els.liveStatus.classList.remove('live');return}els.liveStatus.classList.add('live');els.liveStatus.textContent=state.lastError?`${n} live · refresh failed`:`${n} live · auto-refresh 30s${state.lastLive?' · checked '+formatTime(state.lastLive):''}`}

function firestoreValue(v){if(!v||typeof v!=='object')return undefined;if('nullValue'in v)return null;if('stringValue'in v)return v.stringValue;if('integerValue'in v)return Number(v.integerValue);if('doubleValue'in v)return Number(v.doubleValue);if('booleanValue'in v)return Boolean(v.booleanValue);if('timestampValue'in v)return v.timestampValue;if(v.mapValue){const o={};for(const[k,c]of Object.entries(v.mapValue.fields||{}))o[k]=firestoreValue(c);return o}if(v.arrayValue)return(v.arrayValue.values||[]).map(firestoreValue)}
function firestoreData(doc){const o={};for(const[k,v]of Object.entries(doc?.fields||{}))o[k]=firestoreValue(v);return o}
async function liveSnapshot(g){const url=`https://firestore.googleapis.com/v1/projects/gamesheet-production/databases/(default)/documents/seasons/${encodeURIComponent(state.seasonId)}/games/${encodeURIComponent(g.gameId)}`;const doc=await fetchJson(url),d=firestoreData(doc),total=d?.computed?.scoreboard?.total;if(!total||total.home==null||total.visitor==null)throw new Error('No live total');return {...g,status:d?.computed?.status||d?.data?.game?.status||g.status,home:{...g.home,goals:Number(total.home)},visitor:{...g.visitor,goals:Number(total.visitor)}}}
async function pollLive(){if(state.polling||document.hidden)return;const live=visibleLive();if(!live.length){updateLiveStatus();return}state.polling=true;try{const rs=await Promise.allSettled(live.map(liveSnapshot)),good=rs.filter(x=>x.status==='fulfilled').map(x=>x.value);if(good.length){const m=new Map(good.map(g=>[String(g.gameId),g]));state.games=state.games.map(g=>m.get(String(g.gameId))||g);state.lastLive=new Date();state.lastError=rs.some(x=>x.status==='rejected')}else state.lastError=true;render()}catch(e){state.lastError=true;updateLiveStatus()}finally{state.polling=false}}
function startPolling(){clearInterval(state.poll);state.poll=setInterval(pollLive,LIVE_MS);pollLive()}

function statClock(clock){
    const parts=String(clock||'').split(':');
    if(parts.length===3){return{period:`P${Number(parts[0])||parts[0]}`,time:`${parts[1]}:${parts[2]}`}}
    return{period:'',time:String(clock||'')}
}
function normalizeStatPlayer(p){if(!p||typeof p!=='object')return{};const stats=p.stats||{};return{...p,number:p.number??p.jersey??stats.number??'',g:stats.g??p.g??0,a:stats.a??p.a??0,pts:stats.pts??p.pts??((Number(stats.g)||0)+(Number(stats.a)||0)),pim:stats.pim??p.pim??0}}
function groupEvents(items){const m=new Map();for(const e of items){const key=e.periodLabel||e.period||'';if(!m.has(key))m.set(key,[]);m.get(key).push(e)}return[...m.entries()].map(([period,periodEvents])=>({period,periodEvents}))}
function normalizeFirestoreBox(g,d){
    const visitorData=d?.data?.visitor||{};
    const homeData=d?.data?.home||{};
    const score=d?.computed?.scoreboard?.total||{};
    const shots=d?.computed?.shots?.total||{};
    const rawEvents=Object.values(d?.events||{});
    const goalEvents=[];
    const penaltyEvents=[];

    for(const e of rawEvents){
        const type=String(e?.type||'');
        const c=statClock(e?.time?.clock);
        if(type.includes('Goal')&&e?.for?.scorer){
            const assists=Array.isArray(e.for.assist)?e.for.assist:[];
            goalEvents.push({periodLabel:c.period,period:c.period,time:c.time,goalScorer:normalizeStatPlayer(e.for.scorer),assist1By:normalizeStatPlayer(assists[0]),assist2By:normalizeStatPlayer(assists[1]),team:e.for.team,powerPlay:Boolean(e.powerPlay||e.goal?.powerPlay||e.for?.powerPlay),shg:Boolean(e.shg||e.goal?.shg),en:Boolean(e.en||e.goal?.en),gameWinningGoal:Boolean(e.gameWinningGoal||e.goal?.gameWinningGoal)});
        }
        if(type.includes('HockeyPenalty')){
            const player=e?.for?.player||e?.player||{};
            penaltyEvents.push({periodLabel:c.period,period:c.period,time:c.time,committedBy:normalizeStatPlayer(player),penaltyType:{title:e?.penalty?.label||e?.penalty?.code||'Penalty',duration:e?.penalty?.length||''}});
        }
    }

    const normalizeTeam=(side,data,base)=>({...base,title:data?.details?.title||base?.title||side,logo:base?.logo||data?.details?.logo||'',finalScore:score?.[side]??base?.goals,sog:shots?.[side]??base?.shots,roster:{players:(data?.lineup?.players||[]).map(normalizeStatPlayer)}});
    return{visitor:normalizeTeam('visitor',visitorData,g.visitor||{}),home:normalizeTeam('home',homeData,g.home||{}),tables:{goalsByPeriod:groupEvents(goalEvents),penaltiesByPeriod:groupEvents(penaltyEvents)}};
}
function normalizeUnifiedBox(g){
    const toGoals=(team,side)=>(team?.goalDetails||[]).map(x=>({periodLabel:`P${x.period||''}`,period:`P${x.period||''}`,time:x.clockTime||'',goalScorer:{firstName:x.firstName||'',lastName:x.lastName||'',id:x.id,jersey:x.jersey||''},assist1By:{},assist2By:{},team:{vs:side}}));
    const all=[...toGoals(g.visitor,'visitor'),...toGoals(g.home,'home')];
    return{visitor:{...g.visitor,finalScore:g.visitor?.goals,sog:g.visitor?.shots,roster:{players:[]}},home:{...g.home,finalScore:g.home?.goals,sog:g.home?.shots,roster:{players:[]}},tables:{goalsByPeriod:groupEvents(all),penaltiesByPeriod:[]}};
}
async function openStats(gameId){
    const g=state.games.find(x=>String(x.gameId)===String(gameId));if(!g)return;
    state.boxGame=g;state.boxScore=null;state.statsTab='summary';
    els.drawerSub.textContent=`${g.visitor?.title||'Visitor'} vs ${g.home?.title||'Home'} · ${formatDate(gameDate(g))}`;
    els.drawerBody.className='loading';els.drawerBody.textContent='Loading GameSheet game details…';
    els.drawerBackdrop.classList.add('open');els.statsDrawer.classList.add('open');els.statsDrawer.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';
    try{
        const url=`https://firestore.googleapis.com/v1/projects/gamesheet-production/databases/(default)/documents/seasons/${encodeURIComponent(state.seasonId)}/games/${encodeURIComponent(g.gameId)}`;
        const doc=await fetchJson(url);
        const data=firestoreData(doc);
        state.boxScore=normalizeFirestoreBox(g,data);
        renderStats();
    }catch(e){
        console.warn('Detailed Firestore stats unavailable; using unified-games summary.',e);
        state.boxScore=normalizeUnifiedBox(g);
        renderStats();
        const note=document.createElement('div');note.className='section';note.innerHTML='<div style="color:var(--muted);font-size:.82rem">Detailed assists, penalties, and player stats were unavailable for this game. Showing the stats included in the season game feed.</div>';
        els.drawerBody.prepend(note);
    }
}
function closeStats(){els.drawerBackdrop.classList.remove('open');els.statsDrawer.classList.remove('open');els.statsDrawer.setAttribute('aria-hidden','true');document.body.style.overflow=''}
function playerName(p){const n=[p?.firstName,p?.lastName].filter(x=>String(x||'').trim()).join(' ').trim()||String(p?.title||'').trim();return n||`#${p?.number||p?.jersey||'—'}`}
function goals(box){return (box?.tables?.goalsByPeriod||[]).flatMap(group=>(group.periodEvents||[]).map(e=>({...e,periodLabel:group.period||e.period||''})))}
function penalties(box){return (box?.tables?.penaltiesByPeriod||[]).flatMap(group=>(group.periodEvents||[]).map(e=>({...e,periodLabel:group.period||e.period||''})))}
function roster(box,side){return box?.[side]?.roster?.players||[]}
function goalTitle(e){const scorer=e.goalScorer||{},a1=e.assist1By||{},a2=e.assist2By||{};const assists=[a1,a2].filter(a=>a&&((a.number||'')||(a.title||'').trim())).map(a=>playerName(a));const tags=[e.powerPlay?'PP':'',e.shg?'SH':'',e.en?'EN':'',e.gameWinningGoal?'GWG':''].filter(Boolean);return `<strong>${esc(playerName(scorer))}</strong>${assists.length?` <span style="color:var(--muted)">— A: ${assists.map(esc).join(', ')}</span>`:''}${tags.length?` <span style="color:var(--amber)">${tags.join(' · ')}</span>`:''}`}
function penaltyTitle(e){const p=e.commitedBy||e.committedBy||{},type=e.penaltyType||{};return `<strong>${esc(playerName(p))}</strong> <span style="color:var(--muted)">${esc(type.title||'Penalty')} ${type.duration?`(${esc(type.duration)} min)`:''}</span>`}
function teamStats(box){const h=box.home||{},v=box.visitor||{};return `<div class="stat-grid"><div class="stat-box"><div class="k">Away score</div><div class="v">${esc(v.finalScore??state.boxGame?.visitor?.goals??'—')}</div></div><div class="stat-box"><div class="k">Home score</div><div class="v">${esc(h.finalScore??state.boxGame?.home?.goals??'—')}</div></div><div class="stat-box"><div class="k">Away SOG</div><div class="v">${esc(v.sog??'—')}</div></div><div class="stat-box"><div class="k">Home SOG</div><div class="v">${esc(h.sog??'—')}</div></div></div>`}
function eventList(items,type){if(!items.length)return '<div class="empty" style="padding:18px">No events reported.</div>';return `<div class="event-list">${items.map(e=>`<div class="event"><div class="event-period">${esc(e.periodLabel||e.period||'')}</div><div class="event-time">${esc(e.time||'')}</div><div class="event-title">${type==='goal'?goalTitle(e):penaltyTitle(e)}</div></div>`).join('')}</div>`}
function playerTable(box){const rows=[...roster(box,'visitor').map(p=>({...p,_team:box.visitor?.title||'Away'})),...roster(box,'home').map(p=>({...p,_team:box.home?.title||'Home'}))].filter(p=>p.status!=='scratched');if(!rows.length)return '<div class="empty" style="padding:18px">No roster data reported.</div>';return `<div style="overflow:auto"><table class="player-table"><thead><tr><th>Team</th><th>Player</th><th>#</th><th>G</th><th>A</th><th>PTS</th><th>PIM</th></tr></thead><tbody>${rows.map(p=>`<tr><td>${esc(p._team)}</td><td>${esc(playerName(p))}</td><td>${esc(p.number??p.jersey??'')}</td><td>${esc(p.g??0)}</td><td>${esc(p.a??0)}</td><td>${esc(p.pts??((Number(p.g)||0)+(Number(p.a)||0)))}</td><td>${esc(p.pim??0)}</td></tr>`).join('')}</tbody></table></div>`}
function renderStats(){const b=state.boxScore,g=state.boxGame;if(!b||!g)return;const away=b.visitor||g.visitor,home=b.home||g.home;els.drawerBody.className='';els.drawerBody.innerHTML=`<div class="drawer-score"><div class="drawer-team">${logoHtml(away)}<div class="drawer-team-name">${esc(away.title||g.visitor?.title||'Away')}</div></div><div class="drawer-scorebox">${esc(away.finalScore??g.visitor?.goals??'—')}<span>–</span>${esc(home.finalScore??g.home?.goals??'—')}</div><div class="drawer-team">${logoHtml(home)}<div class="drawer-team-name">${esc(home.title||g.home?.title||'Home')}</div></div></div><div class="tabs"><button class="tab active" data-tab="summary">Summary</button><button class="tab" data-tab="scoring">Scoring</button><button class="tab" data-tab="penalties">Penalties</button><button class="tab" data-tab="players">Players</button></div><div id="summaryPane" class="stats-pane active"><div class="section"><h3>Team stats</h3>${teamStats(b)}</div><div class="section"><h3>Scoring summary</h3>${eventList(goals(b),'goal')}</div></div><div id="scoringPane" class="stats-pane"><div class="section"><h3>Scoring</h3>${eventList(goals(b),'goal')}</div></div><div id="penaltiesPane" class="stats-pane"><div class="section"><h3>Penalties</h3>${eventList(penalties(b),'penalty')}</div></div><div id="playersPane" class="stats-pane"><div class="section"><h3>Players</h3>${playerTable(b)}</div></div>`;els.drawerBody.querySelectorAll('.tab').forEach(btn=>btn.onclick=()=>{els.drawerBody.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===btn));els.drawerBody.querySelectorAll('.stats-pane').forEach(x=>x.classList.remove('active'));$(btn.dataset.tab+'Pane').classList.add('active')})}
function setView(v){state.view=v;els.scheduleView.hidden=v!=='schedule';els.rinkView.hidden=v!=='rink';els.scheduleTab.classList.toggle('active',v==='schedule');els.rinkTab.classList.toggle('active',v==='rink');render();pollLive()}
function changeDay(n){const v=els.rinkDayDate.value||dateKey(new Date()),d=new Date(v+'T12:00:00');d.setDate(d.getDate()+n);els.rinkDayDate.value=dateKey(d);localStorage.setItem('gsv2.rinkDate',els.rinkDayDate.value);render();pollLive()}
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function escAttr(v){return esc(v)}

populateSeasonPicker();
els.seasonPicker.onchange=async()=>{state.seasonId=els.seasonPicker.value;localStorage.setItem('gsv2.seasonId',state.seasonId);await loadSeason()};
els.addSeason.onclick=addSeason;
els.divisionFilter.onchange=()=>{populateTeams();render();pollLive()};
[els.teamFilter,els.whenFilter,els.rinkFilter,els.myTeamOnly,els.favoriteRinksOnly,els.scheduledOnly].forEach(x=>x.onchange=()=>{updateMyTeamButton();render();pollLive()});
els.searchFilter.oninput=()=>{render();pollLive()};
els.setMyTeam.onclick=()=>{if(!els.teamFilter.value)return;state.myTeamBySeason[state.seasonId]=els.teamFilter.value;localStorage.setItem('gsv2.myTeamBySeason',JSON.stringify(state.myTeamBySeason));render()};
els.scheduleTab.onclick=()=>setView('schedule');els.rinkTab.onclick=()=>setView('rink');
els.rinkDayRink.onchange=()=>{localStorage.setItem('gsv2.rink',els.rinkDayRink.value);render();pollLive()};
els.rinkDayDate.onchange=()=>{localStorage.setItem('gsv2.rinkDate',els.rinkDayDate.value);render();pollLive()};
els.prevDay.onclick=()=>changeDay(-1);els.nextDay.onclick=()=>changeDay(1);els.todayBtn.onclick=()=>{els.rinkDayDate.value=dateKey(new Date());localStorage.setItem('gsv2.rinkDate',els.rinkDayDate.value);render();pollLive()};
els.closeDrawer.onclick=closeStats;els.drawerBackdrop.onclick=closeStats;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeStats()});document.addEventListener('visibilitychange',()=>{if(!document.hidden)pollLive()});
loadSeason();
})();
</script>
