<script>
(()=>{'use strict';
const API='https://gamesheetstats.com/api',LIVE_MS=30000;
const DEFAULT_SEASONS=[{id:'15111',title:'Delaware Valley Hockey League — 2026–2027'},{id:'10294',title:'Delaware Valley Hockey League — 2025–2026'}];
const $=id=>document.getElementById(String(id).replace(/^#/,'')),els={seasonPicker:$('seasonPicker'),addSeason:$('addSeason'),status:$('status'),teamView:$('teamView'),venuesView:$('venuesView'),playersView:$('playersView'),scheduleView:$('scheduleView'),backdrop:$('backdrop'),drawer:$('drawer'),drawerTitle:$('drawerTitle'),drawerSub:$('drawerSub'),drawerBody:$('drawerBody'),closeDrawer:$('closeDrawer')};
const state={seasonId:localStorage.getItem('gsv3.seasonId')||localStorage.getItem('gsv2.seasonId')||'15111',season:null,divisions:[],games:[],teams:[],view:localStorage.getItem('gsv3.view')||'team',myTeamBySeason:readJson('gsv3.myTeamBySeason',readJson('gsv2.myTeamBySeason',{})),favoriteRinks:new Set(readJson('gsv3.favoriteRinks',readJson('gsv2.favoriteRinks',[]))),favoritePlayersBySeason:readJson('gsv3.favoritePlayersBySeason',{}),playerCache:{},poll:null,polling:false,lastLive:null,lastError:false,venueRange:'weekend',venueMyTeam:false,schedule:{division:'',team:'',rink:'',when:'upcoming',search:'',myTeam:false,faves:false,scheduled:false}};
state.playerMode='favorites';state.playerRegistry={};state.playerDetailCache={};
if(!state.myTeamBySeason['15111']&&localStorage.getItem('dvhl.myTeamId'))state.myTeamBySeason['15111']=localStorage.getItem('dvhl.myTeamId');
function readJson(k,f){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(f))}catch{return f}}
function savePrefs(){localStorage.setItem('gsv3.seasonId',state.seasonId);localStorage.setItem('gsv3.view',state.view);localStorage.setItem('gsv3.myTeamBySeason',JSON.stringify(state.myTeamBySeason));localStorage.setItem('gsv3.favoriteRinks',JSON.stringify([...state.favoriteRinks]));localStorage.setItem('gsv3.favoritePlayersBySeason',JSON.stringify(state.favoritePlayersBySeason))}
async function fetchJson(url){const r=await fetch(url,{cache:'no-store',credentials:'omit'});if(!r.ok)throw new Error(`${r.status} ${r.statusText}`);const b=await r.json();if(b&&typeof b==='object'&&'status'in b&&b.status!=='success')throw new Error(b.message||b.error||`GameSheet status ${b.status}`);return b}
function dataOf(b){return b&&typeof b==='object'&&'data'in b?b.data:b}function firstData(b){const d=dataOf(b);return Array.isArray(d)?d[0]:d}
function catalog(){const extra=readJson('gsv3.seasons',readJson('gsv2.seasons',[])),m=new Map([...DEFAULT_SEASONS,...extra].map(x=>[String(x.id),x]));return[...m.values()]}
function saveSeason(s){const extras=catalog().filter(x=>!DEFAULT_SEASONS.some(d=>String(d.id)===String(x.id))),m=new Map(extras.map(x=>[String(x.id),x]));m.set(String(s.id),s);localStorage.setItem('gsv3.seasons',JSON.stringify([...m.values()]))}
function fillSeason(){const list=catalog();els.seasonPicker.innerHTML='';for(const s of list){const o=document.createElement('option');o.value=s.id;o.textContent=s.title;els.seasonPicker.appendChild(o)}if(!list.some(x=>String(x.id)===state.seasonId)){const o=document.createElement('option');o.value=state.seasonId;o.textContent=`Season ${state.seasonId}`;els.seasonPicker.appendChild(o)}els.seasonPicker.value=state.seasonId}
async function addSeason(){const raw=prompt('Paste a GameSheet season URL or season ID:');if(!raw)return;const m=String(raw).match(/(?:seasons\/)?(\d{3,})/);if(!m)return alert('Could not find a season ID.');try{const info=firstData(await fetchJson(`${API}/season-info/${m[1]}`));if(!info)throw new Error('Season not found');saveSeason({id:String(info.id||m[1]),title:info.title||`Season ${m[1]}`});state.seasonId=String(info.id||m[1]);savePrefs();fillSeason();await loadSeason()}catch(e){alert(e.message)}}
async function loadSeason(){clearInterval(state.poll);els.status.textContent='Loading season…';try{const[i,d,g]=await Promise.all([fetchJson(`${API}/season-info/${state.seasonId}`),fetchJson(`${API}/season-divisions/${state.seasonId}`),fetchJson(`${API}/unified-games/${state.seasonId}`)]);state.season=firstData(i);state.divisions=dataOf(d)||[];state.games=dedupe(dataOf(g)||[]);if(state.season){saveSeason({id:String(state.season.id||state.seasonId),title:state.season.title||`Season ${state.seasonId}`});fillSeason()}buildTeams();render();startPolling();els.status.textContent=`Loaded ${state.games.length.toLocaleString()} games`}catch(e){els.status.textContent=`Load failed: ${e.message}`;els.status.classList.add('live')}}

async function openStats(id){const g=state.games.find(x=>String(x.gameId)===String(id));if(!g)return;openDrawer('Game Stats',`${g.visitor?.title||'Visitor'} vs ${g.home?.title||'Home'} · ${fmtDate(gameDate(g))}`,'<div class="muted">Loading game details…</div>');try{const u=`https://firestore.googleapis.com/v1/projects/gamesheet-production/databases/(default)/documents/seasons/${state.seasonId}/games/${g.gameId}`,d=firestoreData(await fetchJson(u));renderStats(g,boxFromFirestore(g,d))}catch(e){renderStats(g,{visitor:{...g.visitor,finalScore:g.visitor?.goals,sog:g.visitor?.shots,roster:{players:[]}},home:{...g.home,finalScore:g.home?.goals,sog:g.home?.shots,roster:{players:[]}},tables:{goalsByPeriod:groupEvents([...(g.visitor?.goalDetails||[]).map(x=>({periodLabel:`P${x.period||''}`,time:x.clockTime||'',goalScorer:x,teamSide:'visitor'})),...(g.home?.goalDetails||[]).map(x=>({periodLabel:`P${x.period||''}`,time:x.clockTime||'',goalScorer:x,teamSide:'home'}))]),penaltiesByPeriod:[]}})}}
function pname(p){const n=[p?.firstName,p?.lastName].filter(Boolean).join(' ').trim()||p?.title;return n||`#${p?.number||p?.jersey||'—'}`}function goals(b){return(b?.tables?.goalsByPeriod||[]).flatMap(x=>(x.periodEvents||[]).map(e=>({...e,periodLabel:x.period||e.periodLabel||''})))}function penalties(b){return(b?.tables?.penaltiesByPeriod||[]).flatMap(x=>(x.periodEvents||[]).map(e=>({...e,periodLabel:x.period||e.periodLabel||''})))}
function renderStats(g,b){state._statsBox=b;state._statsGame=g;const away=b.visitor||g.visitor,home=b.home||g.home;for(const side of ['visitor','home'])for(const p of (b?.[side]?.roster?.players||[]))registerPlayer(statsPlayerRecord(p,b[side]));els.drawerBody.innerHTML=`<div class="statscore"><div class="team">${logo(away,'sm')}<b>${esc(away.title||'Away')}</b></div><div class="bigscore">${esc(away.finalScore??g.visitor?.goals??'—')} – ${esc(home.finalScore??g.home?.goals??'—')}</div><div class="team">${logo(home,'sm')}<b>${esc(home.title||'Home')}</b></div></div><div class="tabs"><button class="tab active" data-tab="summary">Summary</button><button class="tab" data-tab="scoring">Scoring</button><button class="tab" data-tab="penalties">Penalties</button><button class="tab" data-tab="players">Players</button></div><div id="summaryPane" class="pane active"><div class="statssection"><h3>Team stats</h3><div class="statsgrid">${sbox('Away score',away.finalScore??g.visitor?.goals)}${sbox('Home score',home.finalScore??g.home?.goals)}${sbox('Away SOG',away.sog??'—')}${sbox('Home SOG',home.sog??'—')}</div></div><div class="statssection"><h3>Scoring summary</h3>${eventList(goals(b),'goal')}</div></div><div id="scoringPane" class="pane"><div class="statssection"><h3>Scoring</h3>${eventList(goals(b),'goal')}</div></div><div id="penaltiesPane" class="pane"><div class="statssection"><h3>Penalties</h3>${eventList(penalties(b),'penalty')}</div></div><div id="playersPane" class="pane"><div class="statssection"><h3>Players</h3>${playerTable(b)}</div></div>`;els.drawerBody.querySelectorAll('.tab').forEach(btn=>btn.onclick=()=>{els.drawerBody.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===btn));els.drawerBody.querySelectorAll('.pane').forEach(x=>x.classList.remove('active'));$(btn.dataset.tab+'Pane').classList.add('active')})}
function sbox(k,v){return`<div class="sbox"><small>${esc(k)}</small><b>${esc(v??'—')}</b></div>`}
function eventList(a,type){if(!a.length)return'<div class="empty" style="padding:16px">No events reported.</div>';return`<div class="events">${a.map(e=>`<div class="event"><div class="ep">${esc(e.periodLabel||'')}</div><div class="et">${esc(e.time||'')}</div><div>${type==='goal'?`${eventTeamTag(e.teamSide)}${inlinePlayerLink(e.goalScorer,e.teamSide)}${[e.assist1By,e.assist2By].filter(x=>x&&(x.firstName||x.lastName||x.title)).length?` <span class="muted">— A: ${[e.assist1By,e.assist2By].filter(x=>x&&(x.firstName||x.lastName||x.title)).map(p=>inlinePlayerLink(p,e.teamSide)).join(', ')}</span>`:''}`:`${eventTeamTag(e.teamSide)}${inlinePlayerLink(e.committedBy,e.teamSide)} <span class="muted">${esc(e.penaltyType?.title||'Penalty')} ${e.penaltyType?.duration?`(${esc(e.penaltyType.duration)} min)`:''}</span>`}</div></div>`).join('')}</div>`}
function statsPlayerRecord(p,team){const n=normStatPlayer(p),pos=String(n.position||'');return{id:String(n.id??''),name:pname(n),kind:pos.toLowerCase().includes('goalie')?'goalie':'skater',number:n.number??n.jersey??'',position:pos,teamId:String(team?.id??''),teamTitle:team?.title||'',teamLogo:team?.logo||'',teamAbbr:team?.abbr||'',divisionId:String(team?.division?.id??''),divisionTitle:team?.division?.title||'',photo:n.photoURL||'',g:n.g??0,a:n.a??0,pts:n.pts??0,pim:n.pim??0,sog:n.sog??n.shots??'—',gaa:n.gaa??'—',svPct:n.savePct??n.svPct??'—',w:n.w??n.wins??'—',so:n.so??n.shutouts??'—'}}
function playerTable(b){const favs=favPlayerMap(),rows=[...(b.visitor?.roster?.players||[]).map(p=>({...normStatPlayer(p),_team:b.visitor?.title||'Away',_side:'visitor'})),...(b.home?.roster?.players||[]).map(p=>({...normStatPlayer(p),_team:b.home?.title||'Home',_side:'home'}))];if(!rows.length)return'<div class="empty" style="padding:16px">No roster data reported.</div>';for(const p of rows)registerPlayer(statsPlayerRecord(p,b[p._side]));return`<div style="overflow:auto"><table><thead><tr><th></th><th>Team</th><th>Player</th><th>#</th><th>G</th><th>A</th><th>PTS</th><th>PIM</th></tr></thead><tbody>${rows.map(p=>`<tr><td><button class="star player-follow ${favs[String(p.id)]?'active':''}" data-player="${escAttr(p.id)}" data-side="${p._side}" title="${favs[String(p.id)]?'Unfollow player':'Follow player'}">${favs[String(p.id)]?'★':'☆'}</button></td><td>${esc(p._team)}</td><td><button class="player-link" data-player="${escAttr(p.id)}">${esc(pname(p))}</button></td><td>${esc(p.number||p.jersey||'')}</td><td>${esc(p.g??0)}</td><td>${esc(p.a??0)}</td><td>${esc(p.pts??0)}</td><td>${esc(p.pim??0)}</td></tr>`).join('')}</tbody></table></div>`}

function openSettings(){const opts=catalog().map(x=>`<option value="${escAttr(x.id)}" ${String(x.id)===String(state.seasonId)?'selected':''}>${esc(x.title||`Season ${x.id}`)}</option>`).join('');openDrawer('Settings','League / season and app information',`<div class="settings-block"><div><label class="label">League / season</label><select id="settingsSeason">${opts}</select></div><button id="settingsAddSeason" class="soft">＋ Add season</button><div class="settings-note">MyHockeyHub is an independent personal viewer using public GameSheet data. It is not affiliated with, endorsed by, sponsored by, or operated by GameSheet.</div></div>`);$('#settingsSeason').onchange=async()=>{state.seasonId=$('#settingsSeason').value;savePrefs();fillSeason();closeDrawer();await loadSeason()};$('#settingsAddSeason').onclick=async()=>{closeDrawer();await addSeason()}}
function bindTeamDelegates(){els.teamView.onclick=e=>{const b=e.target.closest?.('button');if(!b)return;if(b.id==='teamSchedule'||b.id==='allTeamGames'){const t=myTeam();if(t){state.schedule.team=t.id;setView('schedule')}}else if(b.id==='teamPlayers'){state.playerMode='team';setView('players')}else if(b.id==='changeTeam'){delete state.myTeamBySeason[state.seasonId];savePrefs();renderTeam()}}}
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}function escAttr(v){return esc(v)}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>setView(b.dataset.view));$('#menuBtn').onclick=openSettings;bindTeamDelegates();document.addEventListener('click',e=>{const pl=e.target.closest?.('.player-link');if(pl){e.preventDefault();openPlayerDetail(pl.dataset.player);return}const fp=e.target.closest?.('.follow-player-card');if(fp){e.preventDefault();toggleFollowPlayer(fp.dataset.player);return}const vg=e.target.closest?.('.venuegame[data-venue-stats]');if(vg&&!e.target.closest('button,a')){openStats(vg.dataset.venueStats);return}const go=e.target.closest?.('.game-open');if(go){e.preventDefault();window.open(go.dataset.url,'_blank','noopener');return}const add=e.target.closest?.('#addPlayers');if(add){e.preventDefault();openPlayerPicker().catch(err=>console.error(err));return}const follow=e.target.closest?.('.player-follow');if(follow){e.preventDefault();const side=follow.dataset.side,id=String(follow.dataset.player||''),team=state._statsBox?.[side],p=(team?.roster?.players||[]).find(x=>String(x.id)===id);if(!p)return;const m=favPlayerMap();if(m[id])delete m[id];else m[id]=statsPlayerRecord(p,team);saveFavPlayerMap(m);follow.classList.toggle('active',!!m[id]);follow.textContent=m[id]?'★':'☆';follow.title=m[id]?'Unfollow player':'Follow player';}});els.seasonPicker.onchange=async()=>{state.seasonId=els.seasonPicker.value;savePrefs();await loadSeason()};els.addSeason.onclick=addSeason;els.closeDrawer.onclick=closeDrawer;els.backdrop.onclick=closeDrawer;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});document.addEventListener('visibilitychange',()=>{if(!document.hidden)pollLive()});fillSeason();loadSeason();
})();
</script>
