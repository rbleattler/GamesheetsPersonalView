/* V3.2.2: mobile alignment, appearance themes, and expandable player game activity */
html,body{width:100%;max-width:100%;overflow-x:hidden}.drawer{max-width:100vw;overflow-x:hidden}.gamesheet-linkbar{display:flex;justify-content:flex-end;margin:9px 2px 2px}.player-game-card{border:1px solid var(--line);border-radius:14px;background:#102033;overflow:hidden}.player-game-toggle{width:100%;border:0;background:transparent;color:var(--text);display:grid;grid-template-columns:92px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:11px;text-align:left}.player-game-toggle .opp{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.player-game-toggle .summary{white-space:nowrap;border:1px solid #35506d;border-radius:10px;padding:6px 9px;color:#dceafb}.player-game-toggle .chev{color:var(--muted);font-size:1.15rem;transition:transform .15s ease}.player-game-toggle[aria-expanded="true"] .chev{transform:rotate(90deg)}.player-game-events{border-top:1px solid var(--line);padding:9px 11px 11px;background:rgba(5,13,22,.22)}.player-event{display:grid;grid-template-columns:46px 54px 64px minmax(0,1fr);gap:7px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(120,150,180,.13);font-size:.82rem}.player-event:last-child{border-bottom:0}.event-kind{font-weight:850}.event-kind.goal{color:var(--green)}.event-kind.assist{color:var(--blue)}.player-game-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.settings-grid{display:grid;gap:14px}.settings-section{border:1px solid var(--line);border-radius:14px;padding:12px;background:rgba(15,29,44,.55)}.settings-section h3{margin:0 0 10px}.danger{border-color:rgba(255,65,65,.55)!important;color:#ff8d8d!important}.settings-note{margin-top:10px}.theme-help{font-size:.76rem;color:var(--muted);margin-top:6px}

html[data-theme="light"] body{background:radial-gradient(circle at 12% -8%,rgba(51,124,211,.09),transparent 31rem),linear-gradient(180deg,#f7fafe,#eef4f9);color:var(--text)}

async function openSeasonFinder(){openDrawer('Find a league / season','Search the periodically refreshed public season catalog',`<div class="season-finder"><div><label class="label">Search league or season</label><div class="season-search-row"><input id="seasonCatalogSearch" type="search" autocomplete="off" placeholder="DVHL, Delaware Valley, 15111…"><select id="seasonSportFilter"><option value="hockey">Hockey</option><option value="">All sports</option></select></div></div><div id="seasonFinderStatus" class="season-finder-status">Loading season catalog…</div><div id="seasonFinderResults" class="season-search-results"></div><div class="catalog-note">This catalog is a periodically refreshed snapshot of publicly discoverable GameSheet seasons. If a new league or season is missing, you can still add it directly below.</div><section class="manual-season"><label class="label">Add by GameSheet URL or season ID</label><div class="manual-season-row"><input id="manualSeasonInput" type="search" inputmode="numeric" placeholder="https://gamesheetstats.com/seasons/15111 or 15111"><button id="manualSeasonAdd" class="soft">Add season</button></div><div id="manualSeasonStatus" class="season-finder-status"></div></section></div>`);const input=$('#seasonCatalogSearch'),sport=$('#seasonSportFilter'),status=$('#seasonFinderStatus'),results=$('#seasonFinderResults'),manual=$('#manualSeasonInput'),manualBtn=$('#manualSeasonAdd'),manualStatus=$('#manualSeasonStatus');let rows=[];const renderResults=()=>{const q=input.value.trim();if(!q){results.innerHTML='';status.textContent=rows.length?`Search ${rows.length.toLocaleString()} known seasons. Start typing a league name, acronym, or season ID.`:'No catalog entries loaded.';return}if(q.length<2&&!/^\d+$/.test(q)){results.innerHTML='';status.textContent='Type at least 2 characters to search.';return}const hits=searchSeasonCatalog(rows,q,sport.value);status.textContent=hits.length?`${hits.length}${hits.length===30?'+':''} match${hits.length=== async function loadSeason(){clearInterval(state.poll);els.status.textContent='Loading season…';try{const[i,d,g]=await Promise.all([fetchJson(`${API}/season-info/${state.seasonId}`),fetchJson(`${API}/season-divisions/${state.seasonId}`),fetchJson(`${API}/unified-games/${state.seasonId}`)]);state.season=firstData(i);state.divisions=dataOf(d)||[];state.games=dedupe(dataOf(g)||[]);if(state.season){saveSeason({id:String(state.season.id||state.seasonId),title:state.season.title||`Season ${state.seasonId}`});fillSeason()}buildTeams();render();startPolling();els.status.textContent=`Loaded ${state.games.length.toLocaleString()} games`}catch(e){els.status.textContent=`Load failed: ${e.message}`;els.status.classList.add('live')}}
function dedupe(a){const m=new Map();for(const g of a)m.set(String(g.gameId??`${g.timeStampZulu}|${g.home?.id}|${g.visitor?.id}`),g);return[...m.values()]}

function stat(g){return String(g?.status||'').toLowerCase().replace(/[_-]+/g,' ').trim()}function live(g){const s=stat(g);return s==='live'||s==='playing'||s==='active'||s.includes('in progress')||s.startsWith('period ')}function gameDate(g){return new Date(g.timeStampZulu||`${g.date||''} ${g.time||''}`)}function isStaleLive(g){return live(g)&&Date.now()-gameDate(g).getTime()>24*60*60*1000}function showGame(g){return state.showStaleGames||!isStaleLive(g)}
function dateKey(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function fmtDate(d){return new Intl.DateTimeFormat(undefined,{weekday:'short',month:'short',day:'numeric'}).format(d)}function fmtLong(d){return new Intl.DateTimeFormat(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'}).format(d)}function fmtTime(d){return new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit'}).format(d)}function pretty(v){return String(v??'').replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase())}
function divisionSortParts(d){const title=String(d?.title||'').trim(),age=Number(title.match(/(\d{1,2})U\b/i)?.[1]??999),rest=title.replace(/^\s*\d{1,2}U\s*/i,'').trim();let tier=99;if(/\bAAA\b/i.test(rest))tier=0;else if(/\bAA\b/i.test(rest))tier=1;else if(/\bA\b/i.test(rest))tier=2;else if(/\bB\b/i.test(rest))tier=3;else if(/\bC\b/i.test(rest))tier=4;const conference=/\bAmerican\b/i.test(rest)?0:/\bNational\b/i.test(rest)?1:2;return{age,tier,conference,title}}
function sortedDivisions(){return[...state.divisions].sort((a,b)=>{const x=divisionSortParts(a),y=divisionSortParts(b);return x.age-y.age||x.tier-y.tier||x.conference-y.conference||x.title.localeCompare(y.title,undefined,{numeric:true})})}
function abbr(t){return(t?.abbr||String(t?.title||'').split(/\s+/).filter(Boolean).slice(0,3).map(x=>x[0]).join('')).slice(0,4).toUpperCase()||'TEAM'}

function openManageTeams(){const saved=myTeams();openDrawer('My Teams','Add, remove, or switch teams',`<div class="settings-grid"><section class="settings-section"><h3>Add a team</h3><div class="team-picker-grid"><div><label class="label">Division</label><select id="manageTeamDivision"><option value="">Choose division</option>${sortedDivisions().map(d=>`<option value="${d.id}">${esc(d.title)}</option>`).join('')}</select></div><div><label class="label">Team</label><select id="manageTeamPicker"><option value="">Choose a division first</option></select></div></div><div class="actions"><button id="manageAddTeam" class="primary" disabled>Add to My Teams</button></div></section><section class="settings-section"><h3>Saved teams</h3><div id="savedTeamsList" class="saved-teams"></div></section></div>`);const div=$('#manageTeamDivision'),picker=$('#manageTeamPicker'),add=$('#manageAddTeam'),list=$('#savedTeamsList');const fill=()=>{picker.innerHTML='<option value="">Choose a team</option>'+teamPickerOptions(div.value);add.disabled=!picker.value};div.onchange=fill;picker.onchange=()=>add.disabled=!picker.value;add.onclick=()=>{addMyTeam(picker.value);openManageTeams()};const draw=()=>{const teams=myTeams();list.innerHTML=teams.length?teams.map(t=>`<div class="saved-team-row"><div><b>${esc(t.title)}</b><small>${esc(teamDivisionTitle(t))}</small></div><div style="display:flex;gap:6px"><button class="rowbtn" data-activate-team="${escAttr(t.id)}">${String(t.id)===String(myTeamId())?'Active':'View'}</button><button class="rowbtn danger" data-remove-team="${escAttr(t.id)}">Remove</button></div></div>`).join(''):'<div class="muted">No saved teams yet.</div>';list.querySelectorAll('[data-activate-team]').forEach(b=>b.onclick=()=>{setActiveMyTeam(b.dataset.activateTeam);closeDrawer();renderTeam()});list.querySelectorAll('[data-remove-team]').forEach(b=>b.onclick=()=>{removeMyTeam(b.dataset.removeTeam);openManageTeams()})};draw()}

function eventSecondary(e){if(e._type==='goal'){const a=[e.assist1By,e.assist2By].filter(x=>x&&(x.firstName||x.lastName||x.title));return a.length?`A: ${a.map(p=>pname(p)).join(', ')}`:'Unassisted'}const d=e.penaltyType?.duration?` · ${e.penaltyType.duration} min`:'';return`${e.penaltyType?.title||'Penalty'}${d}`}
function eventDetailHtml(e,g){const team=e.teamSide==='visitor'?(state._statsBox?.visitor||g.visitor):(state._statsBox?.home||g.home),gs=`https://gamesheetstats.com/seasons/${state.seasonId}/games/${g.gameId}`;if(e._type==='goal'){const assists=[e.assist1By,e.assist2By].filter(x=>x&&(x.firstName||x.lastName||x.title));return`<div class="event-detail-grid"><div class="event-detail-box"><small>Period</small><b>${esc(e.periodLabel||'—')}</b></div><div class="event-detail-box"><small>Time</small><b>${esc(e.time||'—')}</b></div><div class="event-detail-box"><small>Score after</small><b>${esc(e.scoreAfter||'—')}</b></div></div><div class="event-detail-line"><span>Team</span><b>${esc(team?.title||'—')}</b></div><div class="event-detail-line"><span>Scorer</span><div>${inlinePlayerLink(e.goalScorer,e.teamSide)}</div></div><div class="event-detail-line"><span>Assists</span><div>${assists.length?assists.map(p=>inlinePlayerLink(p,e.teamSide)).join(', '):'<span class="muted">Unassisted</span>'}</div></div><div class="actions"><a class="link" target="_blank" rel="noopener" href="${escAttr(gs)}">Open game on GameSheet ↗</a></div>`}return`<div class="event-detail-grid"><div class="event-detail-box"><small>Period</small><b>${esc(e.periodLabel||'—')}</b></div><div class="event-detail-box"><small>Time</small><b>${esc(e.time||'—')}</b></div><div class="event-detail-box"><small>Minutes</small><b>${esc(e.penaltyType?.duration||e.penaltyType?.minutes||'—')}</b></div></div><div class="event-detail-line"><span>Team</span><b>${esc(team?.title||'—')}</b></div><div class="event-detail-line"><span>Player</span><div>${inlinePlayerLink(e.committedBy,e.teamSide)}</div></div><div class="event-detail-line"><span>Penalty</span><b>${esc(e.penaltyType?.title||'Penalty')}</b></div><div class="actions"><a class="link" target="_blank" rel="noopener" href="${escAttr(gs)}">Open game on GameSheet ↗</a></div>`}
function timelineHtml(b,g,mode='all'){let items=timelineEvents(b);if(mode==='goal')items=items.filter(e=>e._type==='goal');if(mode==='penalty')items=items.filter(e=>e._type==='penalty');if(!items.length)return'<div class="empty" style="padding:18px">No events reported.</div>';const groups=new Map();for(const e of items){const p=e.periodLabel||e.period||'';if(!groups.has(p))groups.set(p,[]);groups.get(p).push(e)}let idx=0;return`<div class="timeline">${[...groups.entries()].map(([p,events])=>`<section class="period-block"><div class="period-head"><span>${esc(periodLabelNice(p))}</span><span class="period-score">${mode==='penalty'?'':esc(periodGoalScore(b,p))}</span></div><div class="timeline-items">${events.map(e=>{const id=`evt-${mode}-${idx++}`,player=e._type==='goal'?e.goalScorer:e.committedBy,icon=e._type==='goal'?'🚨':'⚠️';return`<div class="timeline-event" role="button" tabindex="0" aria-expanded="false" data-target="${id}"><div class="timeline-time">${esc(e.time||'')}</div><div class="timeline-icon" aria-hidden="true">${icon}</div><div>${eventTeamTag(e.teamSide)}</div><div class="timeline-main"><div class="primary">${inlinePlayerLink(player,e.teamSide)}</div><div class="secondary">${esc(eventSecondary(e))}</div></div><div class="timeline-chevron">›</div></div><div id="${id}" class="timeline-detail" hidden>${eventDetailHtml(e,g)}</div>`}).join('')}</div></section>`).join('')}</div>`}
function boxScoreHtml(b){const away=b.visitor||{},home=b.home||{},allPeriods=new Set(['P1','P2','P3']);for(const e of goals(b)){const p=e.periodLabel||e.period;if(p)allPeriods.add(String(p))}const periods=[...allPeriods].sort((a,b)=>periodSortKey(a)-periodSortKey(b)),count=(side,p)=>goals(b).filter(e=>e.teamSide===side&&String(e.periodLabel||e.period||'')===String(p)).length,row=(side,t)=>`<tr><td><div class="box-team">${logo(t,'xs')}<span class="box-team-full">${esc(t.title||pretty(side))}</span><span class="box-team-short">${esc(abbr(t))}</span></div></td>${periods.map(p=>`<td>${count(side,p)}</td>`).join('')}<td class="box-total">${esc(t.finalScore??'—')}</td><td>${esc(t.sog??'—')}</td><td>${esc(teamPimValue(t))}</td></tr>`;return`<div class="box-score-wrap"><table class="box-score"><thead><tr><th>Team</th>${periods.map(p=>`<th>${esc(String(p).replace(/^P/,''))}</th>`).join('')}<th>T</th><th>SOG</th><th>PIM</th></tr></thead><tbody>${row('visitor',away)}${row('home',home)}</tbody></table></div>`}
function wireTimeline(root){root.querySelectorAll('.timeline-event').forEach(row=>{const toggle=()=>{const panel=document.getElementById(row.dataset.target),open=row.getAttribute('aria-expanded')==='true';row.setAttribute('aria-expanded',String(!open));if(panel)panel.hidden=open};row.onclick=e=>{if(e.target.closest('.player-link,a,button'))return;toggle()};row.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&!e.target.closest('.player-link,a,button')){e.preventDefault();toggle()}}})}
function renderStats(g,b){state._statsBox=b;state._statsGame=g;const away=b.visitor||g.visitor,home=b.home||g.home;for(const side of ['visitor','home'])for(const p of (b?.[side]?.roster?.players||[]))registerPlayer(statsPlayerRecord(p,b[side]));const awayPim=teamPimValue(away),homePim=teamPimValue(home),gs=`https://gamesheetstats.com/seasons/${state.seasonId}/games/${g.gameId}`,gameState=pretty(stat(g)||'final');els.drawerBody.innerHTML=`<div class="game-scoreboard"><div class="score-team">${logo(away,'sm')}<div class="score-team-name">${esc(away.title||'Away')}</div><div class="score-team-stats"><span class="score-mini"><small>SOG</small><b>${esc(away.sog??'—')}</b></span><span class="score-mini"><small>PIM</small><b>${esc(awayPim)}</b></span></div></div><div class="score-center"><div class="bigscore">${esc(away.finalScore??g.visitor?.goals??'—')} – ${esc(home.finalScore??g.home?.goals??'—')}</div><div class="score-state">${esc(gameState)}</div><a class="score-gs" target="_blank" rel="noopener" href="${escAttr(gs)}">GameSheet ↗</a></div><div class="score-team">${logo(home,'sm')}<div class="score-team-name">${esc(home.title||'Home')}</div><div class="score-team-stats"><span class="score-mini"><small>SOG</small><b>${esc(home.sog??'—')}</b></span><span class="score-mini"><small>PIM</small><b>${esc(homePim)}</b></span></div></div></div><div class="tabs"><button class="tab active" data-tab="summary">Summary</button><button class="tab" data-tab="scoring">Scoring</button><button class="tab" data-tab="penalties">Penalties</button><button class="tab" data-tab="boxscore">Box Score</button><button class="tab" data-tab="players">Players</button></div><div id="summaryPane" class="pane active"><div class="statssection compact"><div class="summary-heading"><div><h3>Game summary</h3><p>Goals and penalties in chronological order.</p></div></div>${timelineHtml(b,g,'all')}</div></div><div id="scoringPane" class="pane"><div class="statssection compact"><h3>Scoring</h3>${timelineHtml(b,g,'goal')}</div></div><div id="penaltiesPane" class="pane"><div class="statssection compact"><h3>Penalties <span class="muted" style="font-size:.78rem;font-weight:500">${esc(abbr(away))} ${esc(awayPim)} PIM · ${esc(abbr(home))} ${esc(homePim)} PIM</span></h3>${timelineHtml(b,g,'penalty')}</div></div><div id="boxscorePane" class="pane"><div class="statssection"><h3>Box Score</h3>${boxScoreHtml(b)}</div></div><div id="playersPane" class="pane"><div class="statssection"><h3>Players</h3>${playerTable(b)}</div></div>`;els.drawerBody.querySelectorAll('.tab').forEach(btn=>btn.onclick=()=>{els.drawerBody.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===btn));els.drawerBody.querySelectorAll('.pane').forEach(x=>x.classList.remove('active'));$(btn.dataset.tab+'Pane').classList.add('active')});wireTimeline(els.drawerBody)}
function sbox(k,v){return`<div class="sbox"><small>${esc(k)}</small><b>${esc(v??'—')}</b></div>`}
function eventList(a,type){if(!a.length)return'<div class="empty" style="padding:16px">No events reported.</div>';return`<div class="events">${a.map(e=>`<div class="event"><div class="ep">${esc(e.periodLabel||'')}</div><div class="et">${esc(e.time||'')}</div><div>${type==='goal'?`${eventTeamTag(e.teamSide)}${inlinePlayerLink(e.goalScorer,e.teamSide)}${[e.assist1By,e.assist2By].filter(x=>x&&(x.firstName||x.lastName||x.title)).length?` <span class="muted">— A: ${[e.assist1By,e.assist2By].filter(x=>x&&(x.firstName||x.lastName||x.title)).map(p=>inlinePlayerLink(p,e.teamSide)).join(', ')}</span>`:''}`:`${eventTeamTag(e.teamSide)}${inlinePlayerLink(e.committedBy,e.teamSide)} <span class="muted">${esc(e.penaltyType?.title||'Penalty')} ${e.penaltyType?.duration?`(${esc(e.penaltyType.duration)} min)`:''}</span>`}</div></div>`).join('')}</div>`}
function statsPlayerRecord(p,team){const n=normStatPlayer(p),pos=String(n.position||'');return{id:String(n.id??''),name:pname(n),kind:pos.toLowerCase().includes('goalie')?'goalie':'skater',number:n.number??n.jersey??'',position:pos,teamId:String(team?.id??''),teamTitle:team?.title||'',teamLogo:team?.logo||'',teamAbbr:team?.abbr||'',divisionId:String(team?.division?.id??''),divisionTitle:team?.division?.title||'',photo:n.photoURL||'',g:n.g??0,a:n.a??0,pts:n.pts??0,pim:n.pim??0,sog:n.sog??n.shots??'—',gaa:n.gaa??'—',svPct:n.savePct??n.svPct??'—',w:n.w??n.wins??'—',so:n.so??n.shutouts??'—'}}
function playerTable(b){const favs=favPlayerMap(),rows=[...(b.visitor?.roster?.players||[]).map(p=>({...normStatPlayer(p),_team:b.visitor?.title||'Away',_side:'visitor'})),...(b.home?.roster?.players||[]).map(p=>({...normStatPlayer(p),_team:b.home?.title||'Home',_side:'home'}))];if(!rows.length)return'<div class="empty" style="padding:16px">No roster data reported.</div>';for(const p of rows)registerPlayer(statsPlayerRecord(p,b[p._side]));return`<div style="overflow:auto"><table><thead><tr><th></th><th>Team</th><th>Player</th><th>#</th><th>G</th><th>A</th><th>PTS</th><th>PIM</th></tr></thead><tbody>${rows.map(p=>`<tr><td><button class="star player-follow ${favs[String(p.id)]?'active':''}" data-player="${escAttr(p.id)}" data-side="${p._side}" title="${favs[String(p.id)]?'Unfollow player':'Follow player'}">${favs[String(p.id)]?'★':'☆'}</button></td><td>${esc(p._team)}</td><td><button class="player-link" data-player="${escAttr(p.id)}">${esc(pname(p))}</button></td><td>${esc(p.number||p.jersey||'')}</td><td>${esc(p.g??0)}</td><td>${esc(p.a??0)}</td><td>${esc(p.pts??0)}</td><td>${esc(p.pim??0)}</td></tr>`).join('')}</tbody></table></div>`}

function openSettings(){const opts=catalog().map(x=>`<option value="${escAttr(x.id)}" ${String(x.id)===String(state.seasonId)?'selected':''}>${esc(x.title||`Season ${x.id}`)}</option>`).join('');openDrawer('Settings','League, appearance, schedule cleanup, and app data',`<div class="settings-grid"><section class="settings-section"><h3>League / season</h3><label class="label">Current season</label><select id="settingsSeason">${opts}</select><div class="actions"><button id="settingsAddSeason" class="soft">Find / add league</button></div></section><section class="settings-section"><h3>Appearance</h3><label class="label">Theme</label><select id="settingsTheme"><option value="system" ${state.theme==='system'?'selected':''}>Follow device</option><option value="dark" ${state.theme==='dark'?'selected':''}>Dark</option><option value="light" ${state.theme==='light'?'selected':''}>Light</option></select><div class="theme-help">Follow device updates automatically when your system appearance changes.</div></section><section class="settings-section"><h3>Schedule cleanup</h3><label style="display:flex;gap:9px;align-items:flex-start"><input id="settingsShowStale" type="checkbox" ${state.showStaleGames?'checked':''} style="margin-top:3px"><span><b>Show stale games</b><span class="theme-help" style="display:block">A game still marked Live more than 24 hours after its scheduled start is treated as stale. These are usually test games or games that were never properly ended on the scoring device, so they are hidden by default.</span></span></label></section><section class="settings-section"><h3>App data</h3><button id="settingsClearData" class="soft danger">Clear all MyHockeyHub data</button><div class="theme-help">Removes My Teams, favorite venues, My Players, added seasons, and appearance preferences stored on this device.</div></section><div class="settings-note">MyHockeyHub is an independent personal viewer using public GameSheet data. It is not affiliated with, endorsed by, sponsored by, or operated by GameSheet.</div></div>`);$('#settingsSeason').onchange=async()=>{state.seasonId=$('#settingsSeason').value;savePrefs();fillSeason();closeDrawer();await loadSeason()};$('#settingsAddSeason').onclick=async()=>{closeDrawer();await addSeason()};$('#settingsTheme').onchange=()=>{applyTheme($('#settingsTheme').value);savePrefs()};$('#settingsShowStale').onchange=()=>{state.showStaleGames=$('#settingsShowStale').checked;savePrefs();render()};$('#settingsClearData').onclick=clearAppData}
function bindTeamDelegates(){els.teamView.onclick=e=>{const b=e.target.closest?.('button');if(!b)return;if(b.id==='manageTeams'||b.id==='addAnotherTeam')openManageTeams()}}
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}function escAttr(v){return esc(v)}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>setView(b.dataset.view));$('#menuBtn').onclick=openSettings;bindTeamDelegates();document.addEventListener('click',e=>{const pl=e.target.closest?.('.player-link');if(pl){e.preventDefault();openPlayerDetail(pl.dataset.player);return}const fp=e.target.closest?.('.follow-player-card');if(fp){e.preventDefault();toggleFollowPlayer(fp.dataset.player);return}const vg=e.target.closest?.('.venuegame[data-venue-stats]');if(vg&&!e.target.closest('button,a')){openStats(vg.dataset.venueStats);return}const vd=e.target.closest?.('.venuegame[data-venue-details]');if(vd&&!e.target.closest('button,a')){openGameDetails(vd.dataset.venueDetails);return}const add=e.target.closest?.('#addPlayers');if(add){e.preventDefault();openPlayerPicker().catch(err=>console.error(err));return}const follow=e.target.closest?.('.player-follow');if(follow){e.preventDefault();const side=follow.dataset.side,id=String(follow.dataset.player||''),team=state._statsBox?.[side],p=(team?.roster?.players||[]).find(x=>String(x.id)===id);if(!p)return;const m=favPlayerMap();if(m[id])delete m[id];else m[id]=statsPlayerRecord(p,team);saveFavPlayerMap(m);follow.classList.toggle('active',!!m[id]);follow.textContent=m[id]?'★':'☆';follow.title=m[id]?'Unfollow player':'Follow player';}});els.seasonPicker.onchange=async()=>{state.seasonId=els.seasonPicker.value;savePrefs();await loadSeason()};els.addSeason.onclick=addSeason;els.closeDrawer.onclick=closeDrawer;els.backdrop.onclick=closeDrawer;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});document.addEventListener('visibilitychange',()=>{if(!document.hidden)pollLive()});const themeMedia=window.matchMedia?.('(prefers-color-scheme: dark)');themeMedia?.addEventListener?.('change',()=>{if(state.theme==='system')applyTheme('system')});fillSeason();loadSeason();
})();
</script>
