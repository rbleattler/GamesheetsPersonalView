x solid var(--line);border-radius:15px;background:#0e1a28;padding:12px;margin-bottom:10px}.statssection h3{margin:0 0 9px}.statsgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.sbox{background:#132234;border-radius:11px;text-align:center;padding:9px}.sbox small{display:block;color:var(--muted);text-transform:uppercase;font-size:.62rem}.events{display:grid;gap:6px}.event{display:grid;grid-template-columns:42px 48px minmax(0,1fr);gap:7px;background:#122033;border-radius:10px;padding:8px;font-size:.84rem}.event .ep,.event .et{color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:.82rem}th,td{text-align:left;padding:7px 5px;border-bottom:1px solid rgba(120,150,180,.16)}th{color:var(--muted);font-size:.65rem;text-transform:uppercase}.status{font-size:.79rem;color:var(--muted);text-align:right}.status.live{color:#ff7777;font-weight:800}
[hidden]{display:none!important}

<body>
<div class="app">
<header class="top"><div class="brand"><div class="mark">◉</div><div><strong>GameSheets<em>+</em></strong><div class="sub">Personal hockey view</div></div></div><div class="version">V3 preview</div></header>
<nav class="nav"><button data-view="team">👥 My Team</button><button data-view="venues">📍 Venues</button><button data-view="players">👤 Players</button><button data-view="schedule">🗓 Schedule</button></nav>
<section class="panel seasonbar"><select id="seasonPicker"></select><button id="addSeason" class="soft">＋ Add season</button></section>
<div id="status" class="status"></div>
<main id="teamView"></main>
<main id="venuesView" hidden></main>
<main id="playersView" hidden></main>
<main id="scheduleView" hidden></main>
</div>
<div id="backdrop" class="modalback"></div>
<aside id="drawer" class="drawer" aria-hidden="true"><div class="drawerhead"><div><h2 id="drawerTitle">Details</h2><div id="drawerSub" class="muted"></div></div><button id="closeDrawer" class="close">×</button></div><div id="drawerBody"></div></aside>
<script>
(()=>{'use strict';
const API='https://gamesheetstats.com/api',LIVE_MS=30000;
const DEFAULT_SEASONS=[{id:'15111',title:'Delaware Valley Hockey League — 2026–2027'},{id:'10294',title:'Delaware Valley Hockey League — 2025–2026'}];
const $=id=>document.getElementById(id),els={seasonPicker:$('seasonPicker'),addSeason:$('addSeason'),status:$('status'),teamView:$('teamView'),venuesView:$('venuesView'),playersView:$('playersView'),scheduleView:$('scheduleView'),backdrop:$('backdrop'),drawer:$('drawer'),drawerTitle:$('drawerTitle'),drawerSub:$('drawerSub'),drawerBody:$('drawerBody'),closeDrawer:$('closeDrawer')};
const state={seasonId:localStorage.getItem('gsv3.seasonId')||localStorage.getItem('gsv2.seasonId')||'15111',season:null,divisions:[],games:[],teams:[],view:localStorage.getItem('gsv3.view')||'team',myTeamBySeason:readJson('gsv3.myTeamBySeason',readJson('gsv2.myTeamBySeason',{})),favoriteRinks:new Set(readJson('gsv3.favoriteRinks',readJson('gsv2.favoriteRinks',[]))),favoritePlayersBySeason:readJson('gsv3.favoritePlayersBySeason',{}),playerCache:{},poll:null,polling:false,lastLive:null,lastError:false,venueRange:'weekend',venueMyTeam:false,schedule:{division:'',team:'',rink:'',when:'upcoming',search:'',myTeam:false,faves:false,scheduled:false}};
if(!state.myTeamBySeason['15111']&&localStorage.getItem('dvhl.myTeamId'))state.myTeamBySeason['15111']=localStorage.getItem('dvhl.myTeamId');
function readJson(k,f){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(f))}catch{return f}}
function savePrefs(){localStorage.setItem('gsv3.seasonId',state.seasonId);localStorage.setItem('gsv3.view',state.view);localStorage.setItem('gsv3.myTeamBySeason',JSON.stringify(state.myTeamBySeason));localStorage.setItem('gsv3.favoriteRinks',JSON.stringify([...state.favoriteRinks]));localStorage.setItem('gsv3.favoritePlayersBySeason',JSON.stringify(state.favoritePlayersBySeason))}
async function fetchJson(url){const r=await fetch(url,{cache:'no-store',credentials:'omit'});if(!r.ok)throw new Error(`${r.status} ${r.statusText}`);const b=await r.json();if(b&&typeof b==='object'&&'status'in b&&b.status!=='success')throw new Error(b.message||b.error||`GameSheet status ${b.status}`);return b}
function dataOf(b){return b&&typeof b==='object'&&'data'in b?b.data:b}function firstData(b){const d=dataOf(b);return Array.isArray(d)?d[0]:d}
function catalog(){const extra=readJson('gsv3.seasons',readJson('gsv2.seasons',[])),m=new Map([...DEFAULT_SEASONS,...extra].map(x=>[String(x.id),x]));return[...m.values()]}
function saveSeason(s){const extras=catalog().filter(x=>!DEFAULT_SEASONS.some(d=>String(d.id)===String(x.id))),m=new Map(extras.map(x=>[String(x.id),x]));m.set(String(s.id),s);localStorage.setItem('gsv3.seasons',JSON.stringify([...m.values()]))}
function fillSeason(){const list=catalog();els.seasonPicker.innerHTML='';for(const s of list){const o=document.createElement('option');o.value=s.id;o.textContent=s.title;els.seasonPicker.appendChild(o)}if(!list.some(x=>String(x.id)===state.seasonId)){const o=document.createElement('option');o.value=state.seasonId;o.textContent=`Season ${state.seasonId}`;els.seasonPicker.appendChild(o)}els.seasonPicker.value=state.seasonId}
async function addSeason(){const raw=prompt('Paste a GameSheet season URL or season ID:');if(!raw)return;const m=String(raw).match(/(?:seasons\/)?(\d{3,})/);if(!m)return alert('Could not find a season ID.');try{const info=firstData(await fetchJson(`${API}/season-info/${m[1]}`));if(!info)throw new Error('Season not found');saveSeason({id:String(info.id||m[1]),title:info.title||`Season ${m[1]}`});state.seasonId=String(info.id||m[1]);savePrefs();fillSeason();await loadSeason()}catch(e){alert(e.message)}}
async function loadSeason(){clearInterval(state.poll);els.status.textContent='Loading season…';try{const[i,d,g]=await Promise.all([fetchJson(`${API}/season-info/${state.seasonId}`),fetchJson(`${API}/season-divisions/${state.seasonId}`),fetchJson(`${API}/unified-games/${state.seasonId}`)]);state.season=firstData(i);state.divisions=dataOf(d)||[];state.games=dedupe(dataOf(g)||[]);if(state.season){saveSeason({id:String(state.season.id||state.seasonId),title:state.season.title||`Season ${state.seasonId}`});fillSeason()}buildTeams();render();startPolling();els.status.textContent=`Loaded ${state.games.length.toLocaleString()} games`}catch(e){els.status.textContent=`Load failed: ${e.message}`;els.status.classList.add('live')}}
function dedupe(a){const m=new Map();for(const g of a)m.set(String(g.gameId??`${g.timeStampZulu}|${g.home?.id}|${g.visitor?.id}`),g);return[...m.values()]}
function buildTeams(){const m=new Map();for(const g of state.games)for(const t of[g.home,g.visitor]){if(!t?.id)continue;const id=String(t.id);if(!m.has(id))m.set(id,{id,title:t.title||`Team ${id}`,logo:t.logo||'',abbr:t.abbr||'',divisions:new Set()});if(t.division?.id)m.get(id).divisions.add(String(t.division.id));if(t.logo&&!m.get(id).logo)m.get(id).logo=t.logo}state.teams=[...m.values()].sort((a,b)=>a.title.localeCompare(b.title,undefined,{numeric:true}))}
function myTeamId(){return state.myTeamBySeason[state.seasonId]||''}function myTeam(){return state.teams.find(t=>t.id===String(myTeamId()))}function hasTeam(g,id){return id&&(String(g.home?.id)===String(id)||String(g.visitor?.id)===String(id))}
function stat(g){return String(g?.status||'').toLowerCase().replace(/[_-]+/g,' ').trim()}function live(g){const s=stat(g);return s==='live'||s==='playing'||s==='active'||s.includes('in progress')||s.startsWith('period ')}function gameDate(g){return new Date(g.timeStampZulu||`${g.date||''} ${g.time||''}`)}
function dateKey(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function fmtDate(d){return new Intl.DateTimeFormat(undefined,{weekday:'short',month:'short',day:'numeric'}).format(d)}function fmtLong(d){return new Intl.DateTimeFormat(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'}).format(d)}function fmtTime(d){return new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit'}).format(d)}function pretty(v){return String(v??'').replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase())}
function abbr(t){return(t?.abbr||String(t?.title||'').split(/\s+/).filter(Boolean).slice(0,3).map(x=>x[0]).join('')).slice(0,4).toUpperCase()||'TEAM'}
function logo(t,cls=''){const a=esc(abbr(t)),src=logoUrl(t?.logo);return`<span class="logo ${cls}">${src?`<img src="${escAttr(src)}" alt="" loading="lazy" onerror="this.remove();this.parentElement.innerHTML='<span class=&quot;fallback&quot;>${a}</span>'">`:`<span class="fallback">${a}</span>`}</span>`}
function logoUrl(u){if(!u)return'';return /imagedelivery\.net/.test(u)&&!/\/(public|256|128|avatar)$/.test(u)?u.replace(/\/$/,'')+'/256':u}
function badge(g){if(live(g))return'<span class="badge live">● Live</span>';const s=stat(g);return`<span class="badge ${s==='final'?'final':s==='scheduled'?'scheduled':''}">${esc(pretty(g.status||'Scheduled'))}</span>`}
function division(g){const a=g.visitor?.division?.title,b=g.home?.division?.title;return a===b?(a||''):[a,b].filter(Boolean).join(' / ')}

function firestoreValue(v){if(!v||typeof v!=='object')return undefined;if('nullValue'in v)return null;if('stringValue'in v)return v.stringValue;if('integerValue'in v)return Number(v.integerValue);if('doubleValue'in v)return Number(v.doubleValue);if('booleanValue'in v)return!!v.booleanValue;if('timestampValue'in v)return v.timestampValue;if(v.mapValue){const o={};for(const[k,c]of Object.entries(v.mapValue.fields||{}))o[k]=firestoreValue(c);return o}if(v.arrayValue)return(v.arrayValue.values||[]).map(firestoreValue)}function firestoreData(doc){const o={};for(const[k,v]of Object.entries(doc?.fields||{}))o[k]=firestoreValue(v);return o}
async function liveSnapshot(g){const u=`https://firestore.googleapis.com/v1/projects/gamesheet-production/databases/(default)/documents/seasons/${state.seasonId}/games/${g.gameId}`,d=firestoreData(await fetchJson(u)),total=d?.computed?.scoreboard?.total;if(!total||total.home==null||total.visitor==null)throw new Error('No live score');return{...g,status:d?.computed?.status||d?.data?.game?.status||g.status,home:{...g.home,goals:Number(total.home)},visitor:{...g.visitor,goals:Number(total.visitor)}}}
async function pollLive(){if(state.polling||document.hidden)return;const a=visibleLive();if(!a.length){updateStatus();return}state.polling=true;try{const rs=await Promise.allSettled(a.map(liveSnapshot)),good=rs.filter(x=>x.status==='fulfilled').map(x=>x.value);if(good.length){const m=new Map(good.map(g=>[String(g.gameId),g]));state.games=state.games.map(g=>m.get(String(g.gameId))||g);state.lastLive=new Date();state.lastError=rs.some(x=>x.status==='rejected');render()}else{state.lastError=true;updateStatus()}}finally{state.polling=false}}
function startPolling(){clearInterval(state.poll);state.poll=setInterval(pollLive,LIVE_MS);pollLive()}function updateStatus(){const n=visibleLive().length;els.status.classList.toggle('live',!!n);els.status.textContent=n?(state.lastError?`${n} live · refresh failed`:`${n} live · auto-refresh 30s${state.lastLive?' · checked '+fmtTime(state.lastLive):''}`):`Loaded ${state.games.length.toLocaleString()} games`}
function openDrawer(title,sub,html){els.drawerTitle.textContent=title;els.drawerSub.textContent=sub||'';els.drawerBody.innerHTML=html||'';els.backdrop.classList.add('open');els.drawer.classList.add('open');els.drawer.setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}function closeDrawer(){els.backdrop.classList.remove('open');els.drawer.classList.remove('open');els.drawer.setAttribute('aria-hidden','true');document.body.style.overflow=''}
function statClock(c){const p=String(c||'').split(':');return p.length===3?{period:`P${Number(p[0])||p[0]}`,time:`${p[1]}:${p[2]}`}:{period:'',time:String(c||'')}}function normStatPlayer(p){if(!p||typeof p!=='object')return{};const s=p.stats||{};return{...p,number:p.number??p.jersey??s.number??'',g:s.g??p.g??0,a:s.a??p.a??0,pts:s.pts??p.pts??((Number(s.g)||0)+(Number(s.a)||0)),pim:s.pim??p.pim??0}}
function groupEvents(items){const m=new Map();for(const e of items){const k=e.periodLabel||e.period||'';if(!m.has(k))m.set(k,[]);m.get(k).push(e)}return[...m.entries()].map(([period,periodEvents])=>({period,periodEvents}))}
function boxFromFirestore(g,d){const vd=d?.data?.visitor||{},hd=d?.data?.home||{},score=d?.computed?.scoreboard?.total||{},shots=d?.computed?.shots?.total||{},ev=Object.values(d?.events||{}),goals=[],pens=[];for(const e of ev){const type=String(e?.type||''),c=statClock(e?.time?.clock);if(type.includes('Goal')&&e?.for?.scorer){const a=Array.isArray(e.for.assist)?e.for.assist:[];goals.push({periodLabel:c.period,time:c.time,goalScorer:normStatPlayer(e.for.scorer),assist1By:normStatPlayer(a[0]),assist2By:normStatPlayer(a[1])})}if(type.includes('HockeyPenalty'))pens.push({periodLabel:c.period,time:c.time,committedBy:normStatPlayer(e?.for?.player||e?.player||{}),penaltyType:{title:e?.penalty?.label||e?.penalty?.code||'Penalty',duration:e?.penalty?.length||''}})}const team=(side,data,base)=>({...base,title:base?.title||data?.details?.title||side,logo:base?.logo||data?.details?.logo||'',finalScore:score?.[side]??base?.goals,sog:shots?.[side]??base?.shots,roster:{players:(data?.lineup?.players||[]).map(normStatPlayer)}});return{visitor:team('visitor',vd,g.visitor||{}),home:team('home',hd,g.home||{}),tables:{goalsByPeriod:groupEvents(goals),penaltiesByPeriod:groupEvents(pens)}}}
async function openStats(id){const g=state.games.find(x=>String(x.gameId)===String(id));if(!g)return;openDrawer('Game Stats',`${g.visitor?.title||'Visitor'} vs ${g.home?.title||'Home'} · ${fmtDate(gameDate(g))}`,'<div class="muted">Loading game details…</div>');try{const u=`https://firestore.googleapis.com/v1/projects/gamesheet-production/databases/(default)/documents/seasons/${state.seasonId}/games/${g.gameId}`,d=firestoreData(await fetchJson(u));renderStats(g,boxFromFirestore(g,d))}catch(e){renderStats(g,{visitor:{...g.visitor,finalScore:g.visitor?.goals,sog:g.visitor?.shots,roster:{players:[]}},home:{...g.home,finalScore:g.home?.goals,sog:g.home?.shots,roster:{players:[]}},tables:{goalsByPeriod:groupEvents([...(g.visitor?.goalDetails||[]).map(x=>({periodLabel:`P${x.period||''}`,time:x.clockTime||'',goalScorer:x})),...(g.home?.goalDetails||[]).map(x=>({periodLabel:`P${x.period||''}`,time:x.clockTime||'',goalScorer:x}))]),penaltiesByPeriod:[]}})}}
function pname(p){const n=[p?.firstName,p?.lastName].filter(Boolean).join(' ').trim()||p?.title;return n||`#${p?.number||p?.jersey||'—'}`}function goals(b){return(b?.tables?.goalsByPeriod||[]).flatMap(x=>(x.periodEvents||[]).map(e=>({...e,periodLabel:x.period||e.periodLabel||''})))}function penalties(b){return(b?.tables?.penaltiesByPeriod||[]).flatMap(x=>(x.periodEvents||[]).map(e=>({...e,periodLabel:x.period||e.periodLabel||''})))}
function renderStats(g,b){const away=b.visitor||g.visitor,home=b.home||g.home;els.drawerBody.innerHTML=`<div class="statscore"><div class="team">${logo(away,'sm')}<b>${esc(away.title||'Away')}</b></div><div class="bigscore">${esc(away.finalScore??g.visitor?.goals??'—')} – ${esc(home.finalScore??g.home?.goals??'—')}</div><div class="team">${logo(home,'sm')}<b>${esc(home.title||'Home')}</b></div></div><div class="tabs"><button class="tab active" data-tab="summary">Summary</button><button class="tab" data-tab="scoring">Scoring</button><button class="tab" data-tab="penalties">Penalties</button><button class="tab" data-tab="players">Players</button></div><div id="summaryPane" class="pane active"><div class="statssection"><h3>Team stats</h3><div class="statsgrid">${sbox('Away score',away.finalScore??g.visitor?.goals)}${sbox('Home score',home.finalScore??g.home?.goals)}${sbox('Away SOG',away.sog??'—')}${sbox('Home SOG',home.sog??'—')}</div></div><div class="statssection"><h3>Scoring summary</h3>${eventList(goals(b),'goal')}</div></div><div id="scoringPane" class="pane"><div class="statssection"><h3>Scoring</h3>${eventList(goals(b),'goal')}</div></div><div id="penaltiesPane" class="pane"><div class="statssection"><h3>Penalties</h3>${eventList(penalties(b),'penalty')}</div></div><div id="playersPane" class="pane"><div class="statssection"><h3>Players</h3>${playerTable(b)}</div></div>`;els.drawerBody.querySelectorAll('.tab').forEach(btn=>btn.onclick=()=>{els.drawerBody.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===btn));els.drawerBody.querySelectorAll('.pane').forEach(x=>x.classList.remove('active'));$(btn.dataset.tab+'Pane').classList.add('active')})}
function sbox(k,v){return`<div class="sbox"><small>${esc(k)}</small><b>${esc(v??'—')}</b></div>`}function eventList(a,type){if(!a.length)return'<div class="empty" style="padding:16px">No events reported.</div>';return`<div class="events">${a.map(e=>`<div class="event"><div class="ep">${esc(e.periodLabel||'')}</div><div class="et">${esc(e.time||'')}</div><div>${type==='goal'?`<b>${esc(pname(e.goalScorer))}</b>${[e.assist1By,e.assist2By].filter(x=>x&&(x.firstName||x.lastName||x.title)).length?` <span class="muted">— A: ${[e.assist1By,e.assist2By].filter(x=>x&&(x.firstName||x.lastName||x.title)).map(pname).map(esc).join(', ')}</span>`:''}`:`<b>${esc(pname(e.committedBy))}</b> <span class="muted">${esc(e.penaltyType?.title||'Penalty')} ${e.penaltyType?.duration?`(${esc(e.penaltyType.duration)} min)`:''}</span>`}</div></div>`).join('')}</div>`}
function playerTable(b){const rows=[...(b.visitor?.roster?.players||[]).map(p=>({...normStatPlayer(p),_team:b.visitor?.title||'Away'})),...(b.home?.roster?.players||[]).map(p=>({...normStatPlayer(p),_team:b.home?.title||'Home'}))];if(!rows.length)return'<div class="empty" style="padding:16px">No roster data reported.</div>';return`<div style="overflow:auto"><table><thead><tr><th>Team</th><th>Player</th><th>#</th><th>G</th><th>A</th><th>PTS</th><th>PIM</th></tr></thead><tbody>${rows.map(p=>`<tr><td>${esc(p._team)}</td><td>${esc(pname(p))}</td><td>${esc(p.number||p.jersey||'')}</td><td>${esc(p.g??0)}</td><td>${esc(p.a??0)}</td><td>${esc(p.pts??0)}</td><td>${esc(p.pim??0)}</td></tr>`).join('')}</tbody></table></div>`}
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}function escAttr(v){return esc(v)}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>setView(b.dataset.view));els.seasonPicker.onchange=async()=>{state.seasonId=els.seasonPicker.value;savePrefs();await loadSeason()};els.addSeason.onclick=addSeason;els.closeDrawer.onclick=closeDrawer;els.backdrop.onclick=closeDrawer;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});document.addEventListener('visibilitychange',()=>{if(!document.hidden)pollLive()});fillSeason();loadSeason();
})();
